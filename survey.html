{ title:'What would software for group travel be worth to you?', body:function(){ return '<p class="lede">GroupBook is a South African tool that finds the right hotels and venues for a group, gets the quotes in one place, and then runs the guest and travel logistics around the event — rooming lists, flights, transfers, RSVPs. We are deciding what it should cost, and we would rather ask than guess.</p>'+

 '<p class="small" style="margin-top:14px">No prices are shown — we are asking what <em>you</em> would pay. Your answers are stored by PanDaan (Pty) Ltd, the company behind GroupBook, and used only for this research and, if you ask for it, early access. Nothing is shared or sold.</p>'; } },

{ title:'About you', body:function(){ return '<p class="lede">So we can read your answers in context.</p>'+

{ title:'How you do it today', body:function(){ return ''+

{ title:'What GroupBook does — and what you would pay', body:function(){ return '<p class="lede">One record of the group, from the client\'s brief to the money being settled. Here is the job in seven steps, then three plans. For each plan, two numbers: the monthly price at which you would subscribe <b>without hesitation</b>, and the price at which it becomes <b>too expensive</b>. Rand per month, your honest guess — no wrong answers.</p>'+
 '<div class="card" style="padding:14px 16px"><div class="steps">'+

 '<div><b>2 · Shortlist from the directory</b><span>679 hotels and 404 venues, each with the group-desk email on file and the date it was last checked. No more phoning the front desk to find who handles groups this month.</span></div>'+
 '<div><b>3 · Send one request</b><span>One branded request to the whole shortlist, with a deadline. Replies file themselves against the brief.</span></div>'+
 '<div><b>4 · Compare and award</b><span>Quotes are read out of PDFs and emails into a side-by-side comparison — rates, totals, availability, conditions. One click awards; everyone else is told.</span></div>'+
 '<div><b>5 · Invite and look after the guests</b><span>One guest list: invitations, online RSVPs, dietary and special needs, QR check-in, and a personal itinerary on every guest\'s phone that updates when anything changes.</span></div>'+
 '<div><b>6 · Run the travel</b><span>From that same list: a locked rooming list per hotel, passenger lists per airline, transfer sheets with drivers, car hire, supplier packs and vouchers — all regenerated when the list changes.</span></div>'+
 '<div><b>7 · Settle</b><span>Import the card statement; match each line to a booking or purchase order; track budgets per event.</span></div>'+
 '<div class="inbox"><b>Under every step: the Smart Inbox</b><span>Forward any email or PDF — a brief, a quote, a confirmation, an invoice — and GroupBook reads it and files it where it belongs. Anything it is unsure of is flagged for a person.</span></div>'+
 '</div></div>'+
 '<div class="plan"><div class="nm">Sourcing</div><div class="job">Steps 1 to 4. Find the right hotels and venues, get the quotes side by side, choose.</div><ul><li>Clients &amp; briefs — intake link or forwarded email becomes a structured brief, with your client\'s branding on every document</li><li>Hotel &amp; venue sourcing — match from the directory by town, capacity, layout and distance; one branded request; replies file themselves</li><li>Quote comparison — PDF and email quotes read by AI into one comparison; a revised quote updates its own column; export it for the client</li><li>Award and decline in one click; everyone hears back</li><li>Smart Inbox for briefs and quotes</li><li><b>2 people can log in</b> (up to 5) · no guest list</li></ul>'+
   '<div class="pair">'+num('tier1_good_value','Good value — I\'d subscribe without hesitation','e.g. 1500',true,'R','per month')+num('tier1_too_expensive','Too expensive — I would not pay this','e.g. 4000',true,'R','per month')+'</div></div>'+
 '<div class="plan hi"><div class="nm">Boutique</div><div class="job">Everything in Sourcing, plus steps 5 and 6: the guests and the travel, from one list.</div><ul><li>Guests &amp; RSVP — one list with entitlements, dietary and special needs; branded invitations and reminders; online RSVP; sub-events; QR check-in at the door</li><li>Personal itinerary on every guest\'s phone — hotel, flight, transfer, car — that updates when anything changes</li><li>Travel logistics — room blocks and a locked rooming list sent to each hotel\'s group desk; flight legs, passports and a passenger list per airline; transfer sheets with drivers; car hire; supplier packs and vouchers</li><li>Smart Inbox files confirmations straight onto the guest\'s itinerary</li><li><b>60 guest events a year included, each up to 100 registered guests</b>, plus 1 bigger event a year of up to 150</li><li><b>4 people can log in</b> (up to 10)</li></ul>'+
   '<div class="pair">'+num('tier2_good_value','Good value — I\'d subscribe without hesitation','e.g. 4000',true,'R','per month')+num('tier2_too_expensive','Too expensive — I would not pay this','e.g. 9000',true,'R','per month')+'</div></div>'+
 '<div class="plan"><div class="nm">Full House</div><div class="job">Everything in Boutique, for several clients at once, bigger events included, plus step 7: the money.</div><ul><li>Several clients\' events in flight at the same time, each under its own branding</li><li><b>120 guest events a year included, each up to 150 registered guests</b>, plus 3 bigger events a year of up to 200</li><li>Reconciliation — import the card statement; match each line to a booking or purchase order; track purchase orders and budgets per event; supplier invoices read in by the Smart Inbox</li><li>Twice the hands-on help each month</li><li><b>10 people can log in</b> (up to 20)</li></ul>'+
   '<div class="pair">'+num('tier3_good_value','Good value — I\'d subscribe without hesitation','e.g. 8000',true,'R','per month')+num('tier3_too_expensive','Too expensive — I would not pay this','e.g. 18000',true,'R','per month')+'</div></div>'+
 ask('tier_fit','Which plan would fit you?',[[1,'Sourcing — just the hotels, venues and quotes'],[2,'Boutique — I run the guests and the travel too'],[3,'Full House — several clients at once, and the finance'],[4,'Bigger than that — several business units or a signed service agreement'],[5,'Not sure — I would need to see it']]); } },

{ title:'One thing priced per event', body:function(){ return '<p class="lede">Running the invitations and RSVPs for a <b>big</b> event is the one thing we are thinking of pricing per event rather than per month — the way a specialist RSVP supplier charges. Everyday events would be included in the plan.</p>'+
 ask('pay_pref','How would you rather pay for something like this?',[[1,'A monthly subscription that includes everything'],[2,'Per event — only when I use it'],[3,'A smaller subscription plus a per-event charge for big events'],[4,'Not sure']])+

function render(){
  var sc=SCREENS[step]; var v=document.getElementById('view'); REQ={};
  var last=step===SCREENS.length-1;

  document.getElementById('bar').style.width=Math.round(step/(SCREENS.length-1)*100)+'%';
  document.getElementById('back').style.visibility=(step===0||last)?'hidden':'visible';
  var nb=document.getElementById('next'); nb.style.visibility=last?'hidden':'visible'; nb.textContent=step===0?'Start':(step===SCREENS.length-2?'Send my answers':'Next');
  document.getElementById('where').textContent=last||step===0?'':(SCREENS.length-2-step)+' to go';
  v.querySelectorAll('[data-k]').forEach(function(el){
    var ev=el.type==='radio'||el.type==='checkbox'?'change':'input';
    el.addEventListener(ev,function(){ if(el.getAttribute('inputmode')==='numeric'){ var d=el.value.replace(/[^0-9]/g,''); if(d!==el.value) el.value=d; } S[el.getAttribute('data-k')]=el.type==='checkbox'?el.checked:el.value; save();
      if(el.type==='radio'){ v.querySelectorAll('input[name="'+el.name+'"]').forEach(function(r){ r.closest('.opt').classList.toggle('on',r.checked); }); } });
  });
  v.querySelectorAll('[data-mk]').forEach(function(el){ el.addEventListener('change',function(){ var k=el.getAttribute('data-mk'); var box=el.closest('[data-multi]'); var max=+box.getAttribute('data-max');
      var cur=S[k]||[]; if(el.checked){ if(cur.length>=max){ el.checked=false; return; } cur.push(el.value); } else { cur=cur.filter(function(x){return x!==el.value;}); }
      S[k]=cur; save(); el.closest('.opt').classList.toggle('on',el.checked); }); });
  S._step=step; save(); window.scrollTo(0,0);
}
function syncFromDom(){ var v=document.getElementById('view'); v.querySelectorAll('[data-k]').forEach(function(el){ var k=el.getAttribute('data-k'); if(el.type==='radio'){ if(el.checked) S[k]=el.value; } else if(el.type==='checkbox'){ S[k]=el.checked; } else if(el.value!==undefined&&el.value!=='') S[k]=el.value; }); save(); }
function missing(){ var out=[]; Object.keys(REQ).forEach(function(k){ if(!REQ[k]) return; var val=S[k]; if(val===undefined||val===null||val===false||String(val).trim()===''||(Array.isArray(val)&&!val.length)) out.push(k); });
  if(REQ.email && S.email && (!/^[^@\s]+@[^@\s.][^@\s]*\.[^@\s.]{2,}$/.test(S.email) || /\.\./.test(S.email))) out.push('email');
  if(step===SCREENS.length-2 && !S.consent) out.push('consent');
  return out; }
function block(m){ var v=document.getElementById('view'); var first=null; m.forEach(function(k){ var a=v.querySelector('[data-ask="'+k+'"]'); if(a){ a.classList.add('miss'); if(!first) first=a; } });
  var msg=document.getElementById('missmsg'); msg.style.display='block'; msg.textContent=m.length===1?'One question still needs an answer — it is marked in red.':m.length+' questions still need an answer — they are marked in red.';
  if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); var fi=first.querySelector('input:not([type=radio]):not([type=checkbox]),textarea'); if(fi){ setTimeout(function(){ try{fi.focus();}catch(e){} },350); } } }
function payload(){
  var n=function(x){ return x===undefined||x===''||x===null?null:Number(x); };
  return { survey_version:SURVEY_VERSION, source:(new URLSearchParams(location.search).get('src'))||'website',
    name:S.name||null, email:S.email||null, agency:S.agency||null,
    role:n(S.role), rfp_volume:n(S.volume), team_size:n(S.team_size), pain_points:S.pains||[], concept_relevance:n(S.relevance), tier_fit:n(S.tier_fit),
    tier1_good_value:n(S.tier1_good_value), tier1_too_expensive:n(S.tier1_too_expensive), tier2_good_value:n(S.tier2_good_value), tier2_too_expensive:n(S.tier2_too_expensive), tier3_good_value:n(S.tier3_good_value), tier3_too_expensive:n(S.tier3_too_expensive),
    open_feedback:S.open_feedback||null, consent:!!S.consent,
    answers:{ event_size:n(S.event_size), sourcing_today:n(S.sourcing_today), rsvp_today:n(S.rsvp_today), rsvp_paid:n(S.rsvp_paid), pay_pref:n(S.pay_pref), event_price:n(S.event_price), names_clear:n(S.names_clear), big_event:n(S.big_event), hero:n(S.hero), trial:n(S.trial), early_access:true, user_agent:navigator.userAgent },
    website:'' };
}
function submit(){
  var nb=document.getElementById('next'); nb.disabled=true; nb.textContent='Sending…'; var err=document.getElementById('err'); err.style.display='none';
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}).then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok) throw new Error(j&&j.error?j.error:'HTTP '+r.status); return j; }); })
  .then(function(){ if(window.va) window.va('event',{name:'survey_submit'}); if(window.fbq) fbq('track','Lead',{content_name:'survey '+SURVEY_VERSION}); if(window.lintrk) lintrk('track',{conversion_id:window.LI_CONV||0}); S._done=true; save(); step=SCREENS.length-1; render(); })
  .catch(function(e){ nb.disabled=false; nb.textContent='Send my answers'; err.style.display='block';
    var body=encodeURIComponent('GroupBook survey answers\n\n'+JSON.stringify(payload(),null,2));
    err.innerHTML='Sorry — that did not send'+(e&&e.message&&!/HTTP|Failed to fetch|NetworkError/.test(e.message)?' ('+e.message+')':'')+'. Your answers are saved on this phone; please try again in a moment, or <a href="mailto:support@groupbook.co.za?subject=GroupBook%20survey&body='+body+'">email them to us</a> with one tap.'; });
}
document.getElementById('next').onclick=function(){
  syncFromDom(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  var v=document.getElementById('view'); v.querySelectorAll('.ask.miss').forEach(function(a){a.classList.remove('miss');});
  var m=missing(); if(m.length){ block(m); return; }
  if(step===SCREENS.length-2){ submit(); return; }
  if(step<SCREENS.length-1){ step++; render(); } };
document.getElementById('back').onclick=function(){ if(step>0){ step--; render(); } };
if(S._done){ step=SCREENS.length-1; }
render();
</script>
<script defer src="/_vercel/insights/script.js"></script>
