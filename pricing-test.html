<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>GroupBook — would it fit your team?</title>
<link rel="icon" type="image/png" href="https://www.groupbook.co.za/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>button{touch-action:manipulation}
:root{--navy:#152742;--gold:#B88A44;--gold2:#D3B07A;--cream:#F0F0E6;--ink:#1B2530;--ink2:#4C5A67;--ink3:#76838E;--line:#DED9CC;--white:#fff;--ok:#2E7D4F}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FBFAF6;color:var(--ink);font:16px/1.55 "DM Sans","Segoe UI",Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--navy);margin:0;line-height:1.2}
h1{font-size:clamp(26px,5vw,36px)}h2{font-size:clamp(22px,4vw,28px)}h3{font-size:18px}
p{margin:0}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header img{height:30px}header span{font-size:13px;color:#C9D2DC}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 110px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.stepno{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
.lede{color:var(--ink2);font-size:17px;margin-top:10px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.ask{margin-top:22px}.q{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--navy)}
.opt.on{border-color:var(--navy);background:#F4F6F9}
label.f{display:block;margin-top:14px;font-weight:600}
textarea,input[type=text],input[type=number],select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}
textarea{min-height:84px;resize:vertical}
.hint{font-size:13.5px;color:var(--ink3);margin-top:4px}
.note{background:var(--cream);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink2);margin-top:14px}
.plans{display:grid;gap:12px;margin-top:14px}
.plan{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px}
.plan.hi{border-color:var(--gold)}
.plan .nm{font-family:"Playfair Display",serif;font-size:21px;color:var(--navy)}
.plan .pr{font-family:"Playfair Display",serif;font-size:24px;color:var(--navy);margin-top:4px}.plan .pr small{font-family:"DM Sans";font-size:13px;color:var(--ink3)}
.plan .job{color:var(--ink2);font-size:14.5px;margin-top:4px}
.plan ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:14.5px;display:grid;gap:4px}
.plan .who{background:var(--cream);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px}
.steps{display:grid;gap:8px;margin-top:14px}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start}
.step>div{min-width:0}
.step>b{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif;font-size:14px}
.step p{font-size:15px}.step p strong{color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:12px}th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--cream);font-weight:600;font-size:12.5px}
.calc{background:var(--navy);color:#EEF1F4;border-radius:12px;padding:16px;margin-top:16px}
.calc h3{color:#fff}.calc label.f{color:#fff}.calc .hint{color:#C9D2DC}
.calc select,.calc input{background:#fff;color:var(--ink)}
.result{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px;margin-top:14px;font-size:15px}
.result b{font-family:"Playfair Display",serif;font-size:22px;color:#fff;display:block}
.bands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.band{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}.band b{display:block;font-family:"Playfair Display",serif;font-size:18px;color:var(--navy)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:11px 20px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.toast{font-size:13.5px;color:var(--ok);font-weight:600}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:320px;overflow:auto;margin-top:12px}
.why{font-size:13.5px;color:var(--ink3);margin-top:16px;border-left:3px solid var(--gold2);padding-left:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .box{border-radius:12px;padding:14px}
.two .in{background:var(--white);border:1.5px solid var(--navy)}
.two .out{background:var(--navy);color:#EEF1F4}
.two h3{font-size:17px}.two .out h3{color:#fff}
.two p{font-size:14px;margin-top:6px}.two .in p{color:var(--ink2)}.two .out p{color:#D9E0E8}
.two ul{margin:8px 0 0;padding-left:18px;font-size:14px}.two .in ul{color:var(--ink2)}.two .out ul{color:#D9E0E8}
.two .tagline{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:4px}.two .in .tagline{color:var(--gold)}.two .out .tagline{color:var(--gold2)}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.sub{margin:8px 0 2px 0;padding-left:0}
.sub textarea{min-height:60px}
.ask.miss .q{color:#7A2E1A}.sub.miss textarea{border-color:#C9775F}.ask.miss .opts .opt{border-color:#C9775F}
.missmsg{background:#F7E3DB;color:#7A2E1A;border-radius:10px;padding:10px 14px;font-size:14px;margin-top:14px;display:none}
.req{color:var(--gold);font-weight:700;margin-left:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;width:100%}
.pair div{border-radius:8px;padding:8px 10px;font-size:13px}
.pair .b4{background:#F3EFE6;color:var(--ink2)}.pair .af{background:#E4F2E9;color:#1F4D33}
.pair small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:2px;opacity:.75}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.roles span{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.roles span b{color:var(--navy)}
.segs{display:grid;gap:10px;margin-top:12px}
.seg{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.seg h3{font-size:17px}.seg p{font-size:14px;color:var(--ink2);margin-top:4px}
.seg .pl{font-size:12.5px;color:var(--gold);font-weight:600;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.jobs{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.job2{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.job2 h3{font-size:17px}.job2 p{font-size:14px;color:var(--ink2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:12.5px;border-radius:8px;padding:4px 9px}
.chips .full{background:var(--navy);color:#fff}.chips .part{border:1.5px solid var(--gold);color:var(--navy)}
.sc{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;margin-top:10px}
.sc>b{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif;font-size:14px}
.sc h3{font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc .tg{font-family:"DM Sans";font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:6px;padding:2px 7px;border:1.5px solid var(--ok);color:var(--ok)}
.sc .tg.t{border-color:var(--gold);color:var(--gold)}
.sc .bf{font-size:14px;color:var(--ink3);margin-top:6px;font-style:italic}
.sc .wg{font-size:14.5px;color:#1F4D33;margin-top:3px;font-weight:500}
.sc small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;font-style:normal;opacity:.7}
.pl2{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.pl2.hi{border-color:var(--gold)}.pl2 .nm{font-family:"Playfair Display",serif;font-size:21px;color:var(--navy)}
.pl2 .for{font-size:14.5px;color:var(--ink2);margin-top:2px}.pl2 ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:14.5px;color:var(--ink)}
.pl2 li{padding-left:22px;position:relative}.pl2 li:before{content:"\2713";position:absolute;left:0;color:var(--ok);font-weight:700}
@media (max-width:520px){.bands{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}
</style></head><body>
<header><img src="https://www.groupbook.co.za/logo-on-navy.png" alt="GroupBook"><span>Would GroupBook fit your team? A short questionnaire</span></header>
<div class="wrap">
<div class="prog"><i id="bar"></i></div>
<div id="view"></div>
</div>
<div class="navbar"><div class="in"><button class="btn sec" id="back">Back</button><span id="where" style="font-size:13px;color:var(--ink3)"></span><button class="btn" id="next">Next</button></div></div>

<script>
// ---------- state
var S = {}; try { S = JSON.parse(localStorage.getItem('gb_rs') || '{}'); } catch(e) { S = {}; }
function save(){ try{ localStorage.setItem('gb_rs', JSON.stringify(S)); }catch(e){} }
var step = +(S._step || 0);

// ---------- helpers (plain radio / text / number)
function ask(key, q, opts, hint, optional){
  REQ[key] = !optional;
  return '<div class="ask" data-ask="'+key+'"><div class="q">'+q+(optional?'':'<span class="req" title="needed">*</span>')+'</div>'+(hint?'<div class="hint" style="margin:-4px 0 8px">'+hint+'</div>':'')+'<div class="opts">'+
    opts.map(function(o){ var v=o[0], l=o[1], fu=o[2]; var on = S[key]===v; var fk=key+'__'+v;
      var box = fu ? '<div class="sub" data-fu="'+fk+'" style="display:'+(on?'block':'none')+'"><label class="f" style="margin-top:4px;font-weight:500;font-size:14px">'+fu+'<textarea data-k="'+fk+'">'+(S[fk]||'')+'</textarea></label></div>' : '';
      if(fu){ LABELS[fk]={q:l+' — '+fu}; if(on) REQ[fk]=true; }
      return '<div><label class="opt'+(on?' on':'')+'"><input type="radio" name="'+key+'" value="'+v+'"'+(on?' checked':'')+' data-k="'+key+'"><span>'+l+'</span></label>'+box+'</div>'; }).join('')+'</div></div>';
}
var REQ = {};
function txt(key, label, hint){ return '<label class="f">'+label+'<textarea data-k="'+key+'">'+(S[key]||'')+'</textarea></label>'+(hint?'<div class="hint">'+hint+'</div>':''); }
function num(key, label, hint, ph, required){ if(required) REQ[key]=true; return '<div class="ask" data-ask="'+key+'"><label class="f">'+label+(required?'<span class="req">*</span>':'')+'<input type="text" inputmode="numeric" autocomplete="off" data-k="'+key+'" value="'+(S[key]||'')+'" placeholder="'+(ph||'')+'"></label>'+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>'; }
function R(n){ return 'R'+Math.round(n).toLocaleString('en-ZA'); }

// ---------- the model (test values)
var PLANS = {
  sourcing:  { n:'Sourcing', m:1950, inc:0,  cap:0,   passes:0, passcap:0, users:2,  maxu:5,  help:'1 hour' },
  events:    { n:'Boutique',   m:4950, inc:60,  cap:100, passes:1, passcap:150, users:4,  maxu:10, help:'2 hours' },
  business:  { n:'Full House', m:9950, inc:120, cap:150, passes:3, passcap:200, users:10, maxu:20, help:'4 hours' }
};
var BANDS = [[100,4500],[200,9500],[300,14500],[500,19500]];
function bandPrice(g){ for (var i=0;i<BANDS.length;i++){ if (g<=BANDS[i][0]) return BANDS[i][1]; } return null; }

function STEPS_HTML(){
  function c(n,t,bf,wg,tag){ return '<div class="sc"><b>'+n+'</b><div><h3>'+t+' <span class="tg'+(tag?' t':'')+'">'+(tag||'Live')+'</span></h3><div class="bf"><small>Before</small>'+bf+'</div><div class="wg"><small>With GroupBook</small>'+wg+'</div></div></div>'; }
  return '<p class="lede">Seven steps, from the client\'s brief to the final bill. Does this look like your job?</p>'+
  c(1,'The brief arrives','Emails back and forth, retyped into a spreadsheet.','One form. One click makes it a quote request.')+
  c(2,'Shortlist from the directory','Phone the front desk to find who handles groups.','We hold the group-desk address, with the date we last checked it.')+
  c(3,'Send one request','Ten emails, ten follow-ups.','Send once. Replies file themselves.')+
  c(4,'Compare and award','Retype every quote; forget to tell the losers.','Quotes side by side. One click awards; the rest are told.')+
  c(5,'Invite and look after the guests','A spreadsheet of names and an RSVP supplier for each event.','Invite, track and inform every guest from one list.','Being tested')+
  c(6,'Run the travel','Three spreadsheets and a WhatsApp group.','Rooms, flights, transfers and car hire from one list. Change it once; everything updates.')+
  c(7,'Settle','Two days a month in Excel.','Import the card statement and match lines to bookings; you check what does not fit.','Being tested')+
  '<div class="note"><b>Under every step: the Smart Inbox.</b> Forward an email or upload a PDF (a brief, a quote, a ticket, an invoice) and GroupBook files it where it belongs. Anything it is unsure of is flagged for a person.</div>';
}
function planCardsNoPrice(){
  function p(cls,nm,fr,items){ return '<div class="pl2'+cls+'"><div class="nm">'+nm+'</div><div class="for">'+fr+'</div><ul>'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></div>'; }
  return '<p class="lede">Each plan includes everything in the one before it.</p>'+
  p('','Sourcing','For teams that book hotels and venues for groups.',['A directory of hotels and venues, each with the group-desk email on file','One branded request to your whole shortlist','Quotes side by side; award in one click, the others are told','Forward a client\'s email and the request is drafted for you'])+
  p(' hi','Boutique','Sourcing, plus running the event itself.',['One guest list, with dietary and special needs','Rooming lists, flights, transfers and car hire','A personal itinerary on every guest\'s phone','Online RSVP (being tested with our first customer)'])+
  p('','Full House','Boutique, for several clients\' events at once.',['More events, bigger events, more people logging in','Import the card statement and match it to bookings','Purchase orders and budgets per event'])+
  '<div class="note">Larger organisations (more than 10 users, several business units, or buying through procurement): agreed in a contract.</div>';
}
// ---------- survey wiring (submits to the live receiver; no copy-and-paste)
var API = 'https://evuggnswxypyoiwsfbuk.supabase.co/functions/v1/survey';
var SURVEY_VERSION = '2026-10-research16';
var SRC = (new URLSearchParams(location.search).get('src')) || 'website';
var LABELS = {};
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function multi(key, q, opts, hint){
  var sel = S[key] || [];
  return '<div class="ask" data-ask="'+key+'"><div class="q">'+q+'</div>'+(hint?'<div class="hint" style="margin:-4px 0 8px">'+hint+'</div>':'')+'<div class="opts">'+
    opts.map(function(o){ var on = sel.indexOf(o[0])>-1; return '<div><label class="opt'+(on?' on':'')+'"><input type="checkbox" data-m="'+key+'" value="'+o[0]+'"'+(on?' checked':'')+'><span>'+o[1]+'</span></label></div>'; }).join('')+'</div></div>';
}
function tick(key, label, req){
  if(req) REQ[key]=true;
  return '<div class="ask" data-ask="'+key+'" style="margin-top:12px"><label class="opt'+(S[key]?' on':'')+'"><input type="checkbox" data-k="'+key+'"'+(S[key]?' checked':'')+'><span>'+label+(req?'<span class="req">*</span>':'')+'</span></label></div>';
}
function field(key, label, type, ph, req){
  if(req) REQ[key]=true;
  return '<div class="ask" data-ask="'+key+'"><label class="f">'+label+(req?'<span class="req">*</span>':'')+'<input type="'+type+'" data-k="'+key+'" value="'+esc(S[key])+'" placeholder="'+(ph||'')+'" autocomplete="'+(key==='email'?'email':key==='name'?'given-name':'organization')+'"></label></div>';
}

// ---------- answer bands (aligned to the pricing edges: 100 / 150 / 200 / 300 / 500)
var ARCH = [['corp','Inside a company: I organise events or group travel for my own employer (events team, marketing, EA, travel desk)'],['assoc','Inside an association, sports body, non-profit, or a government department or state-owned company'],['agency','An event management company or conference agency'],['mice','An incentive / MICE agency, or a destination management company (DMC)'],['pco','A professional conference organiser (PCO), for association congresses'],['tmc','A travel agency or travel management company (TMC) with a groups desk'],['tours','A tour operator, or an organiser of sports, school or church group tours'],['itc','An independent travel consultant, or a very small agency (one to three people)'],['other','Something else','What do you do?']];
var EV_PM = [['lt1','Fewer than one a month (a few a year)'],['1to2','1 to 2'],['3to5','3 to 5'],['6to10','6 to 10'],['11to25','11 to 25'],['26p','More than 25']];
var SIZE = [['b50','1 to 50'],['b100','51 to 100'],['b150','101 to 150'],['b200','151 to 200'],['b300','201 to 300'],['b500','301 to 500'],['b500p','More than 500']];
var BIG = [['n0','None'],['n1','1'],['n2to3','2 or 3'],['n4to6','4 to 6'],['n7p','7 or more']];
var LAYERS = [['hotels','More than one hotel'],['intl','International flights'],['transfers','More than one transfer supplier'],['visas','Visas or passport details'],['partners','A partner or spouse programme'],['public','Public ticket sales'],['changes','Many changes after the lists were sent'],['none','None of these: it was straightforward']];
var SOURCING = [['phone','I phone the hotels to find the right person, then email'],['email','I email contacts I already have'],['company','A sourcing company or venue finder does it for me'],['tool','A booking tool or platform'],['rare','I rarely source group accommodation']];
var USERS = [['u1','Just me'],['u2to3','2 or 3'],['u4to6','4 to 6'],['u7to10','7 to 10'],['u11to20','11 to 20'],['u20p','More than 20']];
var HOURS = [['h5','Under 5 hours'],['h15','5 to 15 hours'],['h40','16 to 40 hours'],['h40p','More than 40 hours'],['hna','Not sure']];
var RFQ = [['r0','None: I rarely ask hotels for quotes'],['r5','1 to 5 a month'],['r15','6 to 15 a month'],['r40','16 to 40 a month'],['r40p','More than 40 a month']];
var RSVP_WHO = [['own','My team runs it (email, Excel, or a tool)'],['supplier','A specialist RSVP or registration supplier, paid by us or by the client'],['client','The client or the venue does it'],['none','There is no RSVP: guest lists are fixed']];
var APPROVER = [['me','I could approve it myself'],['boss','My manager or a director'],['finance','Finance or procurement'],['unsure','Not sure']];
var STEPS = [['1','Step 1: getting the brief right'],['2','Step 2: finding the right hotels and the right person to ask'],['3','Step 3: sending the requests'],['4','Step 4: chasing and comparing the quotes'],['5','Step 5: inviting and looking after the guests'],['6','Step 6: rooms, flights, transfers, car hire'],['7','Step 7: card statements and reconciliation']];
var REBILL = [['p0','0%: I would have to absorb it'],['p25','1 to 25%'],['p50','26 to 50%'],['p75','51 to 75%'],['p100','76 to 100%'],['na','Not applicable: it would be my own company paying'],['dk','Not sure']];
var STRUCT = {
  A: 'A monthly plan with a set number of events included; bigger events charged per event, as shown above',
  B: 'A monthly plan that includes a yearly pool of guests; once the pool is used, a rate per extra guest',
  C: 'A monthly plan with events included; above the guest limit, a rate per extra guest, never more than the event price shown above',
  D: 'No monthly plan: I pay a fee each time I run an event',
  E: 'A cheaper monthly plan with no help hours included; help from us is charged at R850 an hour when I use it',
  F: 'The same package as shown, at a lower monthly price'
};
function structOpts(){
  if(!S._ord){ var a=['A','B','C','D','E','F']; for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } S._ord=a; save(); }
  return S._ord.map(function(k){ return [k, STRUCT[k]]; }).concat([['stay','None of these: I would carry on as I do today']]);
}
var ACTION = [['buy','Start a paid subscription'],['trial','Trial it first, then decide'],['budget','Seek budget approval'],['current','Continue with our current process or supplier'],['cannot','Cannot judge from this information']];
var UPPER = { b50:50, b100:100, b150:150, b200:200, b300:300, b500:500, b500p:501 };
function bandLabel(list,code){ for(var i=0;i<list.length;i++){ if(list[i][0]===code) return list[i][1]; } return ''; }

// ---------- screens
var SCREENS = [
{ title:'Would GroupBook fit how your team works?', body:function(){ return '<p class="lede">GroupBook is a web tool for people who book group accommodation and travel: corporate events, conferences, incentives, sporting events, etc. We are a South African company (PanDaan (Pty) Ltd) testing which plans, allowances and payment options suit group-booking teams. We would rather ask people who do this work than guess.</p>'+
 '<div class="card" style="border-left:4px solid var(--gold)"><h3>Who is behind this</h3><p style="margin-top:8px">GroupBook was built together with <b>Amanda du Preez</b> of AdP Travel Management, a group travel specialist with more than 30 years in the South African travel industry. It came out of the real work: the briefs, the hotels, the rooming lists, the transfers, the card statements. It is built for the people who do that work. <a href="https://www.groupbook.co.za/" target="_blank" rel="noopener">See what GroupBook does</a>.</p></div>'+
 '<div class="card"><h3>How this works</h3><p style="margin-top:8px">About 12 minutes. Eight short screens. <b>Your answers go straight to us when you press Send on the last screen.</b> There is nothing to copy or paste, and you can pause and come back on the same phone or computer.</p><p style="margin-top:8px">There are no right answers. If something is unclear, tell us: that is exactly what we need to know. These are research options, not offers or negotiations: every name and price here is a <b>test</b>, and your answers do not commit you to buying.</p></div>'+
 '<div class="note"><b>What you get.</b> The results of this research, and the chance of <b>one free hotel or venue sourcing job</b> (not the full Sourcing plan): one real group brief for your team, one round of requests to up to 10 hotels or venues, every quote side by side. One user, 30 days, one per organisation, for the first 20 eligible organisations that finish by 30 November 2026. To ask for it, tick the box on the last screen. It is up to 10 requests: hotels typically reply within a few days and about 1 in 4 send a quote; if a request bounces we correct the address and resend it. You would be one of a founding group of 20, a chance to try it on a real brief, not a guaranteed result. It does not include hotel accommodation, guest management or guaranteed quotes. <b>Your answers can be positive or negative: they do not affect whether you qualify.</b> <a href="/trial" target="_blank" rel="noopener">The terms</a>.</div>'+
 ask('screen','Do you organise or book group events or group travel as part of your work?',[['now','Yes'],['past','I used to'],['no','No']]); } },

{ title:'Your work', body:function(){ return '<p class="lede">Rough answers are fine. These tell us how big and how busy the work is, so we can check that our plans fit the real thing.</p>'+
 ask('archetype','Which of these describes your work best?',ARCH)+
 ask('events_pm','In a normal month (not your busiest), how many group events or group bookings do you handle?',EV_PM,'One event = one client\'s group, however many hotels it needs.')+
 num('events_peak','And in your busiest month of the last 12, about how many?','A rough number is fine. Leave empty if you do not have a busy season.','e.g. 12')+
 num('events_year','Over the last 12 months, about how many group events or group bookings did your team handle in total?','A rough number is fine. Your normal-month answer above and this one should roughly agree; if they do not, your year is seasonal, and that is useful to us.','e.g. 40',true)+
 ask('size_typ','How many guests does a typical event have?',SIZE,'Count the guests who confirmed or registered, not everyone invited. That is how we would measure it.')+
 ask('size_max','And the largest event you handled in the last 12 months?',SIZE)+
 '<div class="ask"><div class="q">In the last 12 months, about how many of the events where your team managed the guests\' RSVP or registration had:</div><div class="hint" style="margin:-4px 0 8px">Estimates are fine. Put 0 if none; leave a box empty if you do not know. If your team only handles travel and not RSVP, leave them all empty.</div></div>'+
 num('sz_b100','100 or fewer registered guests','','e.g. 20')+num('sz_b150','101 to 150 registered guests','','e.g. 6')+num('sz_b200','151 to 200 registered guests','','e.g. 3')+num('sz_b300','201 to 300 registered guests','','e.g. 1')+num('sz_b500','301 to 500 registered guests','','e.g. 0')+num('sz_b500p','More than 500 registered guests','','e.g. 0')+
 multi('layers','Think of your most layered event last year (not the biggest: the one with the most moving parts). Which of these applied?',LAYERS,'Tick all that apply. Optional.'); } },

{ title:'How you do it today', body:function(){ return '<p class="lede">What the work looks like now, before any new tool.</p>'+
 num('users','About how many people in your team would log in and use a tool like this?','A number is fine: four users and six users make a different bill.','e.g. 4',true)+
 ask('hours','From the client\'s brief to the final lists, roughly how many working hours does one typical booking take your team?',HOURS,'Everyone\'s time added together.',true)+
 ask('sourcing_today','When you need group accommodation or a venue, how do you get quotes today?',SOURCING,'',true)+
 ask('rfq_pm','How many separate quote requests do you send to hotels or venues in a normal month?',RFQ,'One request = one brief, sent to one or more hotels.',true)+
 ask('rsvp_who','Who usually runs the guests\' RSVP or registration?',RSVP_WHO,'',true)+
 '<div class="ask"><div class="q">Think of the last event where you paid a supplier to run the RSVP or registration.</div><div class="hint" style="margin:-4px 0 8px">Leave both boxes empty if you never have.</div></div>'+
 num('rsvp_pax','How many registered guests did it have?','','e.g. 120')+num('rsvp_cost','What did the supplier charge in total? (rand)','','e.g. 12000')+
 ask('approver','Who would approve spending on a new tool?',APPROVER,'',true); } },

{ title:'What GroupBook does, in seven steps', body:function(){ return STEPS_HTML() +
 ask('wf_match','Does this match how the work happens where you work?',[['yes','Yes, that is the job'],['mostly','Mostly: something is missing or in the wrong order','What is missing or in the wrong order?'],['no','No, we work quite differently','How does it work where you are?']],'',true)+

{ title:'The three plans', body:function(){ return planCardsNoPrice()+

{ title:'The prices', body:function(){ var f=S.fit; var p=PLANS[f]; return '<p class="lede">Prices are per month, in rand, no VAT charged. Pay monthly and cancel any month, or pay for ten months up front and use it for twelve. Getting started is included: we set you up and run your first real booking with you on a call. Extra people on a plan are R395 a month each, up to the plan maximum.</p>'+
 '<table><tr><th>Plan</th><th>A month</th><th>A year (two months free)</th></tr><tr><td>Sourcing</td><td>R1,950</td><td>R19,500</td></tr><tr><td>Boutique</td><td>R4,950</td><td>R49,500</td></tr><tr><td>Full House</td><td>R9,950</td><td>R99,500</td></tr><tr><td>Larger organisations</td><td colspan="2">Agreed in a contract</td></tr></table>'+
 (p?'<div class="note">You chose <b>'+p.n+'</b> on the previous screen: <b>'+R(p.m)+' a month</b>, or <b>'+R(p.m*10)+' a year</b>.</div>':'<div class="note">You did not choose a plan on the previous screen. Answer for the plan closest to your team\'s needs.</div>')+
 ask('price_fit','When you look at the price of '+(p?p.n:'this plan')+', it feels…',[['cheap','So low that I would doubt the quality'],['good','Good value for what it does'],['fair','About fair'],['high','Higher than I would like'],['toohigh','Too high for us']])+
 ask('buy_at_price','If this plan were available on these terms today, what would your organisation most likely do?',ACTION)+
 txt('buy_why','What is the main reason? One line is enough.')+
 num('price_prohibitive','Optional: at what monthly price would you stop considering this plan? (rand)','Leave empty if you would rather not say.','e.g. 12000')+
 ask('cadence','How would you rather pay?',[['monthly','Monthly, cancel any time'],['annual','Once a year, two months free'],['unsure','Not sure']],'',true); } },

{ title:'Big events, limits and help', body:function(){
  var plan = S.fit==='business' ? 'Full House' : 'Boutique';
  S.ge_guests = UPPER[S.size_max]||0; S.ge_plan = S.fit==='business' ? 'business' : 'events';
  var calc = (S.fit==='sourcing') ? '<div class="note">You chose Sourcing, which has no guest events, so none of this would be charged to you.</div>' : '<div class="calc"><h3>Your largest event</h3><div class="result" id="calcout"><span style="display:block;font-size:14px;margin-bottom:6px">You told us your largest event in the last 12 months had '+esc(bandLabel(SIZE,S.size_max)).toLowerCase()+' guests. On '+plan+':</span>'+calcText()+'</div></div>';
  return '<p class="lede">The monthly plan covers the everyday work. One thing is priced per event: running the guests\' RSVP, sized by the number of guests who <b>registered</b> (cancellations still count). Small events are included; big ones are paid for. Sourcing has no guest events, so none of this applies to it.</p>'+
  '<table><tr><th>Registered guests</th><th>Boutique</th><th>Full House</th></tr><tr><td>Up to 100</td><td>Included<br><small>60 events a year</small></td><td>Included<br><small>120 events a year</small></td></tr><tr><td>101 to 150</td><td>R9,500<br><small>1 a year included</small></td><td>Included<br><small>within the 120</small></td></tr><tr><td>151 to 200</td><td>R9,500</td><td>R9,500<br><small>3 a year included</small></td></tr><tr><td>201 to 300</td><td>R14,500</td><td>R14,500</td></tr><tr><td>301 to 500</td><td>R19,500</td><td>R19,500</td></tr><tr><td>More than 500</td><td>Quoted</td><td>Quoted</td></tr></table>'+
  '<div class="note"><b>An everyday event beyond your yearly count is R4,500</b> (up to 100 guests on Boutique, up to 150 on Full House). Example: a Boutique team that runs 70 events of 80 guests pays the monthly plan, plus 10 &times; R4,500 = R45,000 for the 10 events beyond the 60 included.</div>'+
  '<div class="note"><b>The rest, in one paragraph.</b> Everyone on every plan gets the same fair-use limits: a request can go to up to 25 hotels (we suggest 12) and your company can send 150 requests a day. Go over, and you get a warning, and you can go 20% over once in a month; going over all the time is a conversation, never a surprise invoice. Hands-on help is included each month (1, 2 or 4 hours); more is quoted first at R850 an hour. For a big event you can pre-book remote cover for the event days at R1,950 a day.</div>'+
  calc+
  ask('buy_all','Now that you have seen the monthly price and the extra event charges, what would your organisation most likely do?',ACTION)+
  txt('buy_all_why','What is the main reason? One line is enough.')+
  ask('rebill','If a charge like this applied to an event you run for a client, roughly what share of it could you recover from that client?',REBILL)+
  ask('structure','These are test options, not a decision. Which way of paying would you rather have?',structOpts(),'Pick the one you would choose.')+
  num('approve_limit','Think of a full year of your own events on the plan you chose. Up to what total amount for the year could you approve yourself, without a second quote or a formal business case? Include charges you would recover from clients. (rand a year, excluding VAT)','Leave empty if you could not approve spending on your own.','e.g. 60000'); } },

{ title:'Last step: send it to us', body:function(){ return '<p class="lede">That is everything. Press <b>Send my answers</b> and they go straight to us.</p>'+
 ask('known','Had you heard of or seen GroupBook before today?',[['no','No, this is new to me'],['heard','I had heard of it'],['demo','I have seen a demo'],['know','I know Amanda or Danie personally'],['used','I have used it']],'',true)+field('name','Your first name','text','',true)+field('email','Work email','email','you@company.co.za',true)+field('org','Your organisation','text','')+
 txt('definite','Optional: what one thing would have made this a definite yes for you?')+
 tick('trial_req','Yes, set up my free sourcing job. I understand it is for the first 20 organisations and the terms are on the <a href="/trial" target="_blank" rel="noopener">trial page</a>.')+
 tick('results_optin','Send me the results of this research when they are ready.')+
 tick('interview_ok','I am happy to talk it through on a 15-minute call.')+
 '<div class="hp" aria-hidden="true" style="position:absolute;left:-9999px;height:0;overflow:hidden"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off" data-hp="1"></label></div>'+
 tick('consent','PanDaan (Pty) Ltd (GroupBook) may store these answers and my details for this research and use them to contact me about it. I can ask for my details to be removed at any time by emailing support@groupbook.co.za.',true)+
 '<div class="missmsg" id="sendmsg"></div>'; } }
];

function calcText(){
  var plan=PLANS[S.ge_plan||S.fit||'events']||PLANS.events; if(plan.inc===0) plan=PLANS.events; var g=+S.ge_guests||0;
  if(!g) return '';
  var band=bandPrice(g);
  if(g<=plan.cap) return '<b>Included</b>A '+plan.n+' event of this size is one of the '+plan.inc+' a year included at no extra charge. Your plan stays '+R(plan.m)+' a month.';
  if(g<=plan.passcap) return '<b>Included, as one of your '+plan.passes+' larger event'+(plan.passes>1?'s':'')+' a year</b>Once those are used, an event this size is '+R(band)+'. Your plan stays '+R(plan.m)+' a month.';
  if(band===null) return '<b>Quoted</b>More than 500 guests: we would quote this one. Your plan stays '+R(plan.m)+' a month.';
  return '<b>'+R(band)+' extra for this event</b>It is over what '+plan.n+' includes, so it is charged at its band: estimated when you switch it on and confirmed when registration closes. Your plan stays '+R(plan.m)+' a month.';
}

// ---------- payload
function n(x){ return x===undefined||x===''||x===null?null:(isFinite(Number(x))?Number(x):null); }
function idx(list,key){ var v=S[key]; for(var i=0;i<list.length;i++){ if(list[i][0]===v) return i+1; } return null; }
function cut(s,m){ s=(s==null?'':String(s)).trim(); return s?s.slice(0,m):null; }
function szSum(){ var k=['b100','b150','b200','b300','b500','b500p'],t=0,any=false; k.forEach(function(x){ var v=n(S['sz_'+x]); if(v!==null){ t+=v; any=true; } }); return any?t:null; }
function payload(){
  var fitMap={sourcing:1,events:2,business:3}, roleMap={corp:1,assoc:1,agency:2,mice:2,pco:2,tours:2,tmc:3,itc:4,other:5};
  var tf=fitMap[S.fit]||null; var gv=null, te=tf?n(S.price_prohibitive):null;
  var tl=700; // text caps keep answers under the receiver's 4,096-character limit
  var a={ research15:true, archetype:S.archetype||null, events_pm:S.events_pm||null, events_peak:n(S.events_peak), events_year:n(S.events_year), events_rsvp:szSum(), size_typ:S.size_typ||null, size_max:S.size_max||null, sz:{b100:n(S.sz_b100),b150:n(S.sz_b150),b200:n(S.sz_b200),b300:n(S.sz_b300),b500:n(S.sz_b500),b500p:n(S.sz_b500p)}, layers:(S.layers||[]).join(',')||null,
    users:n(S.users), hours:S.hours||null, sourcing_today:S.sourcing_today||null, rfq_pm:S.rfq_pm||null, rsvp_who:S.rsvp_who||null, rsvp_pax:n(S.rsvp_pax), rsvp_cost:n(S.rsvp_cost), approver:S.approver||null, known:S.known||null,
    wf_match:S.wf_match||null, step_most:S.step_most||null, step_least:S.step_least||null, plan_fit:S.fit||null, forced:S.forced||null,
    price_prohibitive:n(S.price_prohibitive),
    price_fit:S.price_fit||null, buy_at_price:S.buy_at_price||null, buy_all:S.buy_all||null, cadence:S.cadence||null, rebill:S.rebill||null, structure:S.structure||null, structure_order:(S._ord||[]).join(''), approve_limit:n(S.approve_limit),
    trial_req:!!S.trial_req, interview_ok:!!S.interview_ok, results_optin:!!S.results_optin,
    price_unit:'plan prices ZAR per month ex VAT; approve_limit ZAR per year ex VAT; rsvp_cost ZAR total for rsvp_pax registered guests', rev:2,
    t:{ arch_other:cut(S.archetype__other,200), wf_note:cut(S.wf_match__mostly||S.wf_match__no,tl), fit_none:cut(S.fit__none,300), forced_which:cut(S.forced__yes,300), buy_why:cut(S.buy_why,tl), buy_all_why:cut(S.buy_all_why,tl) },
    plan_text_version:'v6.0-2026-10-16', user_agent:(navigator.userAgent||'').slice(0,160) };
  return { survey_version:SURVEY_VERSION, source:SRC, name:cut(S.name,200), email:cut(S.email,200), agency:cut(S.org,200),
    role:roleMap[S.archetype]||null, rfp_volume:idx(RFQ,'rfq_pm'), team_size:n(S.users), pain_points:[], tier_fit:tf, consent:!!S.consent, open_feedback:cut(S.definite,1000),
    tier1_good_value:tf===1?gv:null, tier1_too_expensive:tf===1?te:null, tier2_good_value:tf===2?gv:null, tier2_too_expensive:tf===2?te:null, tier3_good_value:tf===3?gv:null, tier3_too_expensive:tf===3?te:null,
    answers:a, website:(document.querySelector('[data-hp]')||{}).value||'' };
}

// ---------- engine
var N = SCREENS.length;
function endView(kind){
  var share = 'www.groupbook.co.za/pricing-test?src=share';
  if(kind==='no') return '<div class="stepno">Thank you</div><h1>This one is for people who book group travel</h1><p class="lede">Thank you for looking. If you know someone who organises group events or travel, you are welcome to send them <b>'+share+'</b>.</p><p class="hint" style="margin-top:10px"><a href="#" id="redo">I answered No by mistake</a></p>';
  return '<div class="stepno">Sent</div><h1>Thank you. That helps more than you know.</h1><p class="lede">Your answers are with us.'+(S.trial_req?' We will be in touch within two working days to set up your free sourcing job.':'')+(S.results_optin?' We will send you the results when they are ready.':'')+'</p>'+
    '<div class="card"><h3>Know someone else who books groups?</h3><p style="margin-top:6px">Send them <b>'+share+'</b>. One sourcing job per organisation.</p></div>';
}
function render(){
  var v=document.getElementById('view'); REQ={};
  var nav=document.querySelector('.navbar');
  if(S._done || S.screen==='no'){ v.innerHTML=endView(S._done?'done':'no'); nav.style.display='none'; var rd=document.getElementById('redo'); if(rd) rd.onclick=function(e){ e.preventDefault(); S.screen=''; save(); step=0; render(); }; document.getElementById('bar').style.width='100%'; window.scrollTo(0,0); return; }
  nav.style.display='';
  var sc=SCREENS[step]; var last = step===N-1;
  v.innerHTML='<div class="stepno">Screen '+(step+1)+' of '+N+'</div><h1>'+sc.title+'</h1>'+sc.body()+(last?'':'<div class="missmsg" id="missmsg"></div>')+(step>0&&!last?'<p class="hint" style="margin-top:14px">Questions marked * need an answer before you go on. Everything else is optional.</p>':'');
  document.getElementById('bar').style.width=Math.round(step/(N-1)*100)+'%';
  document.getElementById('back').disabled=step===0;
  var nb=document.getElementById('next'); nb.disabled=false; nb.textContent=last?'Send my answers':'Next';
  document.getElementById('where').textContent = last ? '' : (N-1-step)+' to go';
  v.querySelectorAll('[data-k]').forEach(function(el){
    var ev = (el.tagName==='SELECT'||el.type==='radio'||el.type==='checkbox') ? 'change' : 'input';
    el.addEventListener(ev,function(){ var k=el.getAttribute('data-k');
      if(el.type==='checkbox'){ S[k]=el.checked; var lb=el.closest('.opt'); if(lb) lb.classList.toggle('on',el.checked); }
      else { var val=el.value; if(el.getAttribute('inputmode')==='numeric'){ val=val.replace(/[^0-9]/g,''); if(val!==el.value) el.value=val; } S[k]=val; }
      save(); var a=el.closest('.ask'); if(a) a.classList.remove('miss');
      if(el.type==='radio'){ v.querySelectorAll('input[name="'+el.name+'"]').forEach(function(r){ r.closest('.opt').classList.toggle('on', r.checked); var fu=r.closest('div').querySelector('.sub'); if(fu){ fu.style.display=r.checked?'block':'none'; var fk=fu.getAttribute('data-fu'); REQ[fk]=r.checked; } }); }
    });
  });
  v.querySelectorAll('[data-m]').forEach(function(el){ el.addEventListener('change',function(){ var k=el.getAttribute('data-m'); var sel=S[k]||[];
    if(el.checked){ if(sel.indexOf(el.value)<0) sel.push(el.value); if(el.value==='none') sel=['none']; else sel=sel.filter(function(x){return x!=='none';}); }
    else { sel=sel.filter(function(x){return x!==el.value;}); }
    S[k]=sel; save(); v.querySelectorAll('[data-m="'+k+'"]').forEach(function(c){ c.checked=sel.indexOf(c.value)>-1; c.closest('.opt').classList.toggle('on',c.checked); }); }); });
  S._step=step; save(); window.scrollTo(0,0);
}
function missing(){ var v=document.getElementById('view'); var out=[];
  Object.keys(REQ).forEach(function(k){ if(!REQ[k]) return; var el=v.querySelector('[data-k="'+k+'"]'); if(!el) return;
    var val=S[k]; if(el.type==='checkbox'){ if(!val) out.push(k); return; } if(val===undefined||val===null||String(val).trim()==='') out.push(k); });
  return out; }
function flag(keys,msgId,suffix){ var v=document.getElementById('view'); var first=null;
  keys.forEach(function(k){ var el=v.querySelector('[data-k="'+k+'"]'); var a=el&&(el.closest('.ask')||el.closest('.sub')); if(a){ a.classList.add('miss'); if(!first) first=a; } });
  var msg=document.getElementById(msgId); if(msg){ msg.style.display='block'; msg.textContent=keys.length===1?'One '+suffix+' still needs an answer. It is marked in red.':keys.length+' '+suffix+'s still need an answer. They are marked in red.'; }
  if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); var fi=first.querySelector('input,textarea,select'); if(fi&&fi.type!=='radio'&&fi.type!=='checkbox'){ setTimeout(function(){ try{fi.focus();}catch(e){} },350); } } }
function submit(){
  var v=document.getElementById('view'); v.querySelectorAll('.ask.miss').forEach(function(a){a.classList.remove('miss');});
  var m=missing();
  if(!S.email||!/^[^@\s]+@[^@\s.][^@\s]*\.[^@\s.]{2,}$/.test(S.email)||/\.\./.test(S.email)){ if(m.indexOf('email')<0) m.push('email'); }
  if(S.trial_req && !(S.org&&String(S.org).trim())) m.push('org');
  if(m.length){ flag(m,'sendmsg','thing'); return; }
  var b=document.getElementById('next'); b.disabled=true; b.textContent='Sending…';
  var p=payload();
  if(JSON.stringify(p.answers).length>3900){ Object.keys(p.answers.t).forEach(function(k){ if(p.answers.t[k]) p.answers.t[k]=p.answers.t[k].slice(0,100); }); }
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
  .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok) throw new Error(j&&j.error?j.error:'HTTP '+r.status); return j; }); })
  .then(function(){ S._done=true; save(); render(); })
  .catch(function(e){ b.disabled=false; b.textContent='Send my answers'; var msg=document.getElementById('sendmsg'); msg.style.display='block';
    var body=encodeURIComponent('GroupBook research survey\n\n'+JSON.stringify(p,null,2));
    msg.innerHTML='Sorry, that did not send'+(e&&e.message&&!/HTTP|Failed to fetch|NetworkError/.test(e.message)?' ('+esc(e.message)+')':'')+'. Your answers are saved on this phone; please try again in a moment, or <a href="mailto:support@groupbook.co.za?subject=GroupBook%20research%20survey&body='+body+'">email them to us</a> with one tap.'; });
}
document.getElementById('next').onclick=function(){
  var v=document.getElementById('view');
  v.querySelectorAll('[data-k]').forEach(function(el){ var k=el.getAttribute('data-k'); if(el.type==='radio'){ if(el.checked) S[k]=el.value; } else if(el.type==='checkbox'){ S[k]=el.checked; } else if(el.value!==undefined && el.value!=='') S[k]=el.value; }); save();
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  if(step===N-1){ submit(); return; }
  v.querySelectorAll('.ask.miss').forEach(function(a){a.classList.remove('miss');});
  var m=missing(); if(m.length){ flag(m,'missmsg','question'); return; }
  if(step===0 && S.screen==='no'){ render(); return; }
  step++; render(); };
document.getElementById('back').onclick=function(){ if(step>0){ step--; render(); } };
render();
</script>
