<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GroupBook — help us test our plans and prices</title>
<link rel="icon" type="image/png" href="https://www.groupbook.co.za/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#152742;--gold:#B88A44;--gold2:#D3B07A;--cream:#F0F0E6;--ink:#1B2530;--ink2:#4C5A67;--ink3:#76838E;--line:#DED9CC;--white:#fff;--ok:#2E7D4F}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FBFAF6;color:var(--ink);font:16px/1.55 "DM Sans","Segoe UI",Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--navy);margin:0;line-height:1.2}
h1{font-size:clamp(26px,5vw,36px)}h2{font-size:clamp(22px,4vw,28px)}h3{font-size:18px}
p{margin:0}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header img{height:30px}header span{font-size:13px;color:#C9D2DC}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 110px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.stepno{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
.lede{color:var(--ink2);font-size:17px;margin-top:10px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.ask{margin-top:22px}.q{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--navy)}
.opt.on{border-color:var(--navy);background:#F4F6F9}
label.f{display:block;margin-top:14px;font-weight:600}
textarea,input[type=text],input[type=number],select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}
textarea{min-height:84px;resize:vertical}
.hint{font-size:13.5px;color:var(--ink3);margin-top:4px}
.note{background:var(--cream);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink2);margin-top:14px}
.plans{display:grid;gap:12px;margin-top:14px}
.plan{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px}
.plan.hi{border-color:var(--gold)}
.plan .nm{font-family:"Playfair Display",serif;font-size:21px;color:var(--navy)}
.plan .pr{font-family:"Playfair Display",serif;font-size:24px;color:var(--navy);margin-top:4px}.plan .pr small{font-family:"DM Sans";font-size:13px;color:var(--ink3)}
.plan .job{color:var(--ink2);font-size:14.5px;margin-top:4px}
.plan ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:14.5px;display:grid;gap:4px}
.plan .who{background:var(--cream);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px}
.steps{display:grid;gap:8px;margin-top:14px}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start}
.step>div{min-width:0}
.step>b{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif;font-size:14px}
.step p{font-size:15px}.step p strong{color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:12px}th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--cream);font-weight:600;font-size:12.5px}
.calc{background:var(--navy);color:#EEF1F4;border-radius:12px;padding:16px;margin-top:16px}
.calc h3{color:#fff}.calc label.f{color:#fff}.calc .hint{color:#C9D2DC}
.calc select,.calc input{background:#fff;color:var(--ink)}
.result{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px;margin-top:14px;font-size:15px}
.result b{font-family:"Playfair Display",serif;font-size:22px;color:#fff;display:block}
.bands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.band{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}.band b{display:block;font-family:"Playfair Display",serif;font-size:18px;color:var(--navy)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:11px 20px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.toast{font-size:13.5px;color:var(--ok);font-weight:600}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:320px;overflow:auto;margin-top:12px}
.why{font-size:13.5px;color:var(--ink3);margin-top:16px;border-left:3px solid var(--gold2);padding-left:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .box{border-radius:12px;padding:14px}
.two .in{background:var(--white);border:1.5px solid var(--navy)}
.two .out{background:var(--navy);color:#EEF1F4}
.two h3{font-size:17px}.two .out h3{color:#fff}
.two p{font-size:14px;margin-top:6px}.two .in p{color:var(--ink2)}.two .out p{color:#D9E0E8}
.two ul{margin:8px 0 0;padding-left:18px;font-size:14px}.two .in ul{color:var(--ink2)}.two .out ul{color:#D9E0E8}
.two .tagline{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:4px}.two .in .tagline{color:var(--gold)}.two .out .tagline{color:var(--gold2)}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.sub{margin:8px 0 2px 0;padding-left:0}
.sub textarea{min-height:60px}
.ask.miss .q{color:#7A2E1A}.sub.miss textarea{border-color:#C9775F}.ask.miss .opts .opt{border-color:#C9775F}
.missmsg{background:#F7E3DB;color:#7A2E1A;border-radius:10px;padding:10px 14px;font-size:14px;margin-top:14px;display:none}
.req{color:var(--gold);font-weight:700;margin-left:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;width:100%}
.pair div{border-radius:8px;padding:8px 10px;font-size:13px}
.pair .b4{background:#F3EFE6;color:var(--ink2)}.pair .af{background:#E4F2E9;color:#1F4D33}
.pair small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:2px;opacity:.75}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.roles span{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.roles span b{color:var(--navy)}
.segs{display:grid;gap:10px;margin-top:12px}
.seg{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.seg h3{font-size:17px}.seg p{font-size:14px;color:var(--ink2);margin-top:4px}
.seg .pl{font-size:12.5px;color:var(--gold);font-weight:600;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.jobs{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.job2{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.job2 h3{font-size:17px}.job2 p{font-size:14px;color:var(--ink2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:12.5px;border-radius:8px;padding:4px 9px}
.chips .full{background:var(--navy);color:#fff}.chips .part{border:1.5px solid var(--gold);color:var(--navy)}
@media (max-width:520px){.bands{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}
</style></head><body>
<header><img src="https://www.groupbook.co.za/logo-on-navy.png" alt="GroupBook"><span>Plans and prices — a test, not a price list</span></header>
<div class="wrap">
<div class="prog"><i id="bar"></i></div>
<div id="view"></div>
</div>
<div class="navbar"><div class="in"><button class="btn sec" id="back">Back</button><span id="where" style="font-size:13px;color:var(--ink3)"></span><button class="btn" id="next">Next</button></div></div>

<script>
// ---------- state
var S = {}; try { S = JSON.parse(localStorage.getItem('gb_pt') || '{}'); } catch(e) { S = {}; }
function save(){ try{ localStorage.setItem('gb_pt', JSON.stringify(S)); }catch(e){} }
var step = +(S._step || 0);

// ---------- helpers (plain radio / text / number)
function ask(key, q, opts, hint, optional){
  REQ[key] = !optional;
  return '<div class="ask" data-ask="'+key+'"><div class="q">'+q+(optional?'':'<span class="req" title="needed">*</span>')+'</div>'+(hint?'<div class="hint" style="margin:-4px 0 8px">'+hint+'</div>':'')+'<div class="opts">'+
    opts.map(function(o){ var v=o[0], l=o[1], fu=o[2]; var on = S[key]===v; var fk=key+'__'+v;
      var box = fu ? '<div class="sub" data-fu="'+fk+'" style="display:'+(on?'block':'none')+'"><label class="f" style="margin-top:4px;font-weight:500;font-size:14px">'+fu+'<textarea data-k="'+fk+'">'+(S[fk]||'')+'</textarea></label></div>' : '';
      if(fu){ LABELS[fk]={q:l+' — '+fu}; if(on) REQ[fk]=true; }
      return '<div><label class="opt'+(on?' on':'')+'"><input type="radio" name="'+key+'" value="'+v+'"'+(on?' checked':'')+' data-k="'+key+'"><span>'+l+'</span></label>'+box+'</div>'; }).join('')+'</div></div>';
}
var REQ = {};
function txt(key, label, hint){ return '<label class="f">'+label+'<textarea data-k="'+key+'">'+(S[key]||'')+'</textarea></label>'+(hint?'<div class="hint">'+hint+'</div>':''); }
function num(key, label, hint, ph, required){ if(required) REQ[key]=true; return '<div class="ask" data-ask="'+key+'"><label class="f">'+label+(required?'<span class="req">*</span>':'')+'<input type="number" inputmode="numeric" data-k="'+key+'" value="'+(S[key]||'')+'" placeholder="'+(ph||'')+'"></label>'+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>'; }
function R(n){ return 'R'+Math.round(n).toLocaleString('en-ZA'); }

// ---------- the model (test values)
var PLANS = {
  sourcing:  { n:'Sourcing', m:1950, inc:0,  cap:0,   users:2,  hotels:400,  newc:200, docs:100, help:'1 hour' },
  events:    { n:'Events',   m:4950, inc:120, cap:100, users:5,  hotels:1200, newc:300, docs:300, help:'2 hours' },
  business:  { n:'Business', m:9950, inc:120, cap:100, users:10, hotels:3000, newc:500, docs:750, help:'4 hours' }
};
var BANDS = [[100,4500],[200,9500],[300,14500],[500,19500]];
function bandPrice(g){ for (var i=0;i<BANDS.length;i++){ if (g<=BANDS[i][0]) return BANDS[i][1]; } return null; }

function planCards(){
  return '<div class="plans">'+
  '<div class="plan"><div class="nm">Sourcing</div><div class="pr">R1,950<small> a month</small></div><div class="job">Find hotels and venues, ask the right people for quotes, compare them side by side, and pick one.</div><ul><li>A list of 679 hotels and 404 venues in South Africa, with the group-bookings email address on file and the date it was last checked</li><li>Send one request to all the hotels you choose, in your company\'s branding</li><li>The quotes that come back are laid out side by side so you can compare</li><li>Choose the winner; the others are told automatically</li><li>Forward a client\'s email and the request is drafted for you</li></ul><div class="who" style="background:#F4F6F9"><b>Guest events:</b> not in this plan — Sourcing has no guest list. Choose Events if you run the guests.</div><div class="who"><b>Meant for:</b> a team that books group accommodation or venues several times a year and wants three comparable quotes without the phone calls.</div></div>'+
  '<div class="plan hi"><div class="nm">Events</div><div class="pr">R4,950<small> a month</small></div><div class="job">Everything in Sourcing, plus running the event itself: the guests, their rooms, flights and transfers.</div><ul><li>One guest list, with each person\'s dietary and special needs</li><li>Rooms allocated; a rooming list for each hotel, made for you</li><li>Flight lists per airline; transfer schedules with drivers; car hire</li><li>Each guest gets a personal itinerary on their phone</li><li>Guests can RSVP online <i style="color:var(--ink3)">(being tested with our first customer)</i></li></ul><div class="who" style="background:#F4F6F9"><b>Guest events:</b> included — up to 120 a year, each up to 100 guests. An event with more than 100 guests is charged per event.</div><div class="who"><b>Meant for:</b> a team that runs the event after the quotes come in — guests, rooms, flights, transfers — and sends the hotels and suppliers their lists.</div></div>'+
  '<div class="plan"><div class="nm">Business</div><div class="pr">R9,950<small> a month</small></div><div class="job">Everything in Events, with room for several clients\' events at once, plus matching the card statement to what was booked.</div><ul><li>Double the people and two and a half times the hotels of the Events plan</li><li>Import the company card statement; your team matches each line to a booking or purchase order in the workspace (automatic matching is coming Q4 2026)</li><li>Track purchase orders and budgets per event</li></ul><div class="who" style="background:#F4F6F9"><b>Guest events:</b> included — up to 120 a year, each up to 100 guests. An event with more than 100 guests is charged per event.</div><div class="who"><b>Meant for:</b> an agency or travel desk running groups for several clients, that has to hand finance a card statement matched to bookings.</div></div>'+
  '<div class="plan" style="background:var(--cream)"><div class="nm">Larger organisations</div><div class="pr" style="font-size:18px">Price agreed in a contract</div><div class="job">For more than 10 users, several business units, or a company that buys through procurement.</div></div>'+
  '</div>';
}

// ---------- screens
var SCREENS = [
{ title:'Thank you for helping', body:function(){ return '<p class="lede">GroupBook is a web tool for people who book group accommodation and travel — conferences, incentives, year-end functions, sports tours. Before we put prices on our website, we would like the honest opinion of people who have done this work.</p>'+
 '<div class="card"><h3>How this works</h3><p style="margin-top:8px">About 15 minutes. Twelve short screens, and a few are just reading. Nothing is sent anywhere until the last screen, where you copy your answers and send them to Danie on WhatsApp or email.</p><p style="margin-top:8px">There are no right answers. If something is unclear, say so — that is exactly what we need to know. Every name and price here is a <b>test</b>, not a decision.</p><p style="margin-top:8px">Your answers come back the way you type them; you can pause and come back later on the same phone or computer.</p></div>'+
 txt('name','Your name (optional)')+'<div class="hint">Only so Danie knows who to thank.</div>'; } },

{ title:'About you', body:function(){ return '<p class="lede">So we can read your answers in context.</p>'+
 ask('role','Which of these is closest to the work you do, or did?',[['corp','Organising events or group travel inside a company (events team, marketing, EA, travel desk)'],['agency','At an event or incentive agency'],['tmc','At a travel agency or travel management company'],['other','Something else','What do or did you do?']])+
 ask('status','Are you doing this work now?',[['now','Yes, currently'],['moved','No — I moved to other work'],['retired','No — I have retired']])+
 ask('volume','Roughly how many group events or group bookings a year were you involved in?',[['lt5','Fewer than 5'],['5to20','5 to 20'],['21to60','21 to 60'],['60plus','More than 60']])+
 ask('size','How big was a typical event?',[['s','Under 50 people'],['m','50 to 150 people'],['l','150 to 500 people'],['xl','More than 500 people']])+
 txt('sizes','Thinking about your last few events: roughly how many guests were invited to each? (For example: 40, 120, 350, 60)','A few numbers is enough. We use this to check where we have drawn our lines.')+
 ask('approver','Who approved spending on a new tool or supplier?',[['me','I could'],['boss','My manager or a director'],['finance','Finance or procurement'],['unsure','Not sure']])+
 txt('tools','What did you use to do this work? (For example: Outlook and Excel, a travel agent, an RSVP company, a specific system)'); } },

{ title:'What GroupBook does, in seven steps', body:function(){ return '<p class="lede">Read this and tell us whether it matches how the work actually happens.</p>'+
 '<div class="steps">'+
 '<div class="step"><b>1</b><div><p><strong>Capture the brief.</strong> What the client needs: dates, people, rooms, meeting space, flights, transfers, car hire, budget. One form for the client — or forward their email and the brief is drafted for you to check.</p><div class="pair"><div class="b4"><small>Today</small>Emails back and forth to pin it down, then retyping it into a spreadsheet</div><div class="af"><small>With GroupBook</small>One form or one forwarded email</div></div></div></div>'+
'<div class="step"><b>2</b><div><p><strong>Shortlist from the directory.</strong> Hotels and venues by town, size, layout and distance. Each has the group-bookings email address on file, with the date it was last checked.</p><div class="pair"><div class="b4"><small>Today</small>Phone the front desk to find out who handles groups — it changes every time staff change</div><div class="af"><small>With GroupBook</small>The right address is already on file</div></div></div></div>'+
'<div class="step"><b>3</b><div><p><strong>Send one request.</strong> In your branding, to every hotel on the shortlist, with a deadline. Any other supplier — a transfer company, an airline desk, car hire — can get the same request.</p><div class="pair"><div class="b4"><small>Today</small>Ten separate emails, ten follow-ups</div><div class="af"><small>With GroupBook</small>One request; the replies file themselves against the brief</div></div></div></div>'+
'<div class="step"><b>4</b><div><p><strong>Compare and award.</strong> Quotes are read out of the PDFs and emails into a side-by-side comparison. A revised quote updates its own column. Choose the winner in one click; the others are told automatically.</p><div class="pair"><div class="b4"><small>Today</small>Retype every quote; forget to tell the ones that lost</div><div class="af"><small>With GroupBook</small>Read for you, compared for you, everyone told</div></div></div></div>'+
'<div class="step"><b>5</b><div><p><strong>Invite and look after the guests.</strong> One guest list. Invitations and reminders in your branding; guests reply online, give their dietary and special requirements, choose their sessions; a QR code and check-in at the door for conferences. Each guest gets a personal itinerary on their phone — hotel, flight, transfer, car — that updates when anything changes. <i style="color:var(--ink3)">(online RSVP and the guest page: being tested with our first customer)</i></p><div class="pair"><div class="b4"><small>Today</small>A spreadsheet of names, an RSVP supplier for the bigger ones, confirmations typed one by one</div><div class="af"><small>With GroupBook</small>Invite, track and inform every guest from the same list</div></div></div></div>'+
'<div class="step"><b>6</b><div><p><strong>Run the travel.</strong> From that same guest list. <b>Rooms:</b> room blocks per hotel, rooms assigned automatically, a locked rooming list sent to each hotel\'s group desk, the hotel\'s reference number carried back to the guest. <b>Flights:</b> legs and seat counts, bookings imported, passports captured for international routes, a passenger list per airline. <b>Transfers:</b> pick-ups and drop-offs, drivers assigned, a transfer sheet per supplier, changes flagged until the supplier is told. <b>Car hire:</b> vehicle, drivers, pick-up and return. Supplier packs and vouchers come out of the record, not retyped.</p><div class="pair"><div class="b4"><small>Today</small>The same names in three spreadsheets and a WhatsApp group; the hotel gets last week\'s list</div><div class="af"><small>With GroupBook</small>Change the list once; every rooming list, passenger list, transfer sheet and itinerary updates</div></div></div></div>'+
'<div class="step"><b>7</b><div><p><strong>Settle.</strong> Import the company card statement; your team matches each line to a booking or purchase order in the workspace; track purchase orders and budgets per event. Automatic matching: coming Q4 2026. <i style="color:var(--ink3)">(automatic matching: coming Q4 2026)</i></p><div class="pair"><div class="b4"><small>Today</small>Two days a month in Excel</div><div class="af"><small>With GroupBook</small>Statement lines matched; you check the exceptions</div></div></div></div>'+
'<div class="card" style="margin-top:14px;border-left:4px solid var(--gold)"><h3>The engine under all seven steps: the Smart Inbox</h3><p style="margin-top:6px;font-size:14.5px;color:var(--ink2)">Forward any email or upload any PDF — a client\'s brief, a hotel\'s quote, a flight or hotel confirmation, a supplier invoice — and GroupBook reads it, works out what it is, and files it where it belongs: the brief, the comparison, the guest\'s itinerary, the reconciliation. New suppliers are recognised from what they send you. Anything it is unsure of is flagged for a person, not filed silently.</p></div>'+
'<div class="hint" style="margin-top:12px">Who does what:</div><div class="roles"><span><b>Client</b> sends the brief</span><span>→</span><span><b>You</b> shortlist, ask, choose</span><span>→</span><span><b>Hotels</b> quote and confirm</span><span>→</span><span><b>Guests</b> travel on one itinerary</span><span>→</span><span><b>Finance</b> settles</span></div>'+
 ask('wf_match','Does this match how the work happens where you worked?',[['yes','Yes, that is the job'],['mostly','Mostly — something is missing or in the wrong order','What is missing or in the wrong order?'],['no','No, we worked quite differently','How did it work where you were?']])+
 ask('wf_pain','Which step took the most time or caused the most frustration?',[['1','Step 1 — getting the brief right'],['2','Step 2 — finding the right hotels and the right person to ask'],['3','Step 3 — sending the requests'],['4','Step 4 — chasing and comparing the quotes'],['5','Step 5 — inviting and looking after the guests'],['6','Step 6 — rooms, flights, transfers, car hire'],['7','Step 7 — the statements and reconciliation']])+
 txt('wf_note','Anything missing, wrong, or not how you would do it?'); } },

{ title:'Who it is for', body:function(){ return '<p class="lede">GroupBook does two jobs, and different kinds of teams need different amounts of each. Tell us where you would have fitted.</p>'+
 '<div class="jobs"><div class="job2"><h3>Job 1 — Find and book the suppliers</h3><p>Hotels and venues: the full job — find, ask, compare, choose. Flights, transfers and car hire: captured on the brief and the same request can go to any supplier.</p><div class="chips"><span class="full">Hotels</span><span class="full">Venues</span><span class="part">Flights</span><span class="part">Transfers</span><span class="part">Car hire</span></div></div>'+
 '<div class="job2"><h3>Job 2 — Run the group</h3><p>Invite the guests and collect their replies; then, from that one list: room blocks and a rooming list for each hotel, passenger lists for each airline, transfer sheets with drivers, car-hire bookings, supplier packs and vouchers, and a personal itinerary for each guest that updates when anything changes.</p><div class="chips"><span class="full">Rooms</span><span class="full">Flights</span><span class="full">Transfers</span><span class="full">Car hire</span><span class="full">Itineraries</span></div></div></div>'+
 '<div class="hint" style="margin-top:14px">Four kinds of team we built it for:</div>'+
 '<div class="segs">'+
 '<div class="seg"><h3>A company\'s own events or travel team</h3><p>Conferences, year-ends, roadshows, incentives. Gets three quotes by phoning and emailing hotels; keeps it all in Outlook and Excel; has a travel agent for flights.</p><div class="pl">Usually starts on Sourcing, grows to Events</div></div>'+
 '<div class="seg"><h3>An event or incentive agency</h3><p>Runs conferences and launches for several clients at once, with room blocks of 50 to 300 people. Needs its own branding on everything and clean rooming lists for the venues.</p><div class="pl">Usually Events, grows to Business</div></div>'+
 '<div class="seg"><h3>A travel agency or travel management company</h3><p>Runs groups for corporate or government clients: group flights, hotel blocks, transfers — and has to hand finance a card statement matched to bookings.</p><div class="pl">Usually Business</div></div>'+
 '<div class="seg"><h3>A specialist who moves groups</h3><p>Sports tours, school trips, church groups, a small company\'s offsites. The same group, many suppliers, one deadline.</p><div class="pl">Usually Sourcing, adds Events when running the guests too</div></div></div>'+
 ask('seg_fit','Which of these is closest to the team you worked in?',[['corp','A company\'s own events or travel team'],['agency','An event or incentive agency'],['tmc','A travel agency or travel management company'],['specialist','A specialist who moves groups'],['none','None of these','Describe your team in a line or two']])+
 ask('seg_right','Does the description of that team sound right?',[['yes','Yes, that is us'],['partly','Partly','What is different about how your team worked?'],['no','No','How would you describe the team?']])+
 txt('seg_missing','Is there a kind of team we have missed that should be here?'); } },

{ title:'How the pricing works', body:function(){ return '<p class="lede">This is the part we most want your opinion on, so it comes before any numbers. There are two parts to the price: what is <b>in your plan</b>, and the one thing that is <b>paid per event</b>.</p>'+
 '<div class="two"><div class="box in"><div class="tagline">In your plan — one monthly price</div><h3>The everyday work</h3><p>Everything your team does month in, month out:</p><ul><li>Finding hotels and venues and asking them for quotes</li><li>Comparing the quotes and choosing</li><li>The guest list and everything made from it: rooming lists, flight lists, transfer schedules, car hire, each guest\'s itinerary</li><li>Matching the card statement (on the bigger plan)</li><li>Getting started, help each month, and fixing anything that breaks</li></ul><p style="margin-top:8px">Each plan has sensible limits (how many people can log in, how many hotels you can contact a month). Those limits come later.</p></div>'+
 '<div class="box out"><div class="tagline">Per event — the one exception</div><h3>Running the guests\' RSVP for an event</h3><p>Sending the invitations, collecting the yes/no replies, the online guest page, and checking guests in at the door.</p><p style="margin-top:8px"><b style="color:#fff">Why is this the exception?</b> Because it is a separate piece of work that many companies pay a specialist supplier for, event by event. Including every size of event in one monthly plan would mean a 1,000-guest awards evening cost the same as a 20-person dinner. So the small ones are in the plan and the big ones are paid for.</p><ul><li>Small events are <b style="color:#fff">included</b>: on the Events and Business plans you can run up to 120 guest events a year with no extra charge, as long as each has 100 guests or fewer. A 40-person dinner or an 80-person workshop costs nothing extra. On a yearly subscription all 120 are available from day one; on a month-to-month subscription the allowance builds up at 10 a month and carries over, up to 120. It is shared by everyone in your organisation.</li><li>An event with <b style="color:#fff">more than 100 guests</b> is charged per event, by number of guests — the same price whether you are a company or an agency. The band prices on the guest-events screen are the full amount: nothing further is added or deducted.</li><li>Personal travel itineraries are part of the plan whether or not you run the RSVP in GroupBook</li><li>You see the amount and approve it before anything is switched on</li><li>Using the guest list only for rooming lists, flights or transfers is <b style="color:#fff">never</b> charged</li><li>If several organisations work on one event, it is charged once, to one of them</li></ul></div></div>'+
 ask('concept_clear','Is the idea of "in your plan" versus "per event" clear?',[['yes','Yes, I understand it'],['mostly','Mostly','What is not quite clear?'],['no','No','What lost you?']])+
 ask('concept_fair','Before you see any numbers: does paying per event for the RSVP part feel fair?',[['fair','Yes, fair — it is a separate job'],['twice','No, it feels like paying twice for the same thing','What would feel fair instead?'],['prefer_in','I would rather it was all in the monthly price, even if the monthly price was higher'],['unsure','Not sure yet — I need to see the numbers']])+
 ask('concept_who','In your experience, who usually paid for the RSVP part?',[['us','The company itself, to a supplier'],['agency','The event agency, passed on in its fee'],['nobody','Nobody — we did it ourselves in Excel or email'],['unsure','Not sure']])+
 txt('concept_note','Anything you would change about how this is split, or how it is explained?'); } },

{ title:'The three plans', body:function(){ return '<p class="lede">Each plan includes everything in the plan before it, and each says where it stands on guest events. We want to know whether the <b>names</b> make sense and whether the <b>right things</b> are in each plan. Ignore the prices for now — they come next.</p>'+planCards()+
 ask('names_clear','Do the plan names tell you what each plan is for?',[['yes','Yes, I understood them straight away'],['partly','Partly — one of them is unclear','Which name, and what did you think it meant?'],['no','No, I had to read the small print to work it out','Which names confused you?']])+
 txt('names_fix','If you would rename any plan, what would you call it? (For example, our first customer suggested "Business" instead of "Agency".)')+
 ask('fit','Which plan would your old team have needed?',[['sourcing','Sourcing'],['events','Events'],['business','Business'],['larger','Larger organisations'],['none','None of them fits','Why not? What would have fitted?']])+
 ask('forced','Would you have had to buy a bigger plan than you needed, just to get one feature?',[['no','No'],['yes','Yes','Which feature, and which plan is it in?'],['unsure','Not sure']])+
 txt('plan_note','Is anything in the wrong plan? Anything you would move up or down?'); } },

{ title:'The prices', body:function(){ var f=S.fit; var p=PLANS[f]; return '<p class="lede">Prices are per month, in rand, no VAT charged. Pay monthly and cancel any month, or pay for ten months up front and use it for twelve. Getting started is included: we set you up and run your first real booking with you on a call.</p>'+
 '<table><tr><th>Plan</th><th>A month</th><th>A year (two months free)</th></tr><tr><td>Sourcing</td><td>R1,950</td><td>R19,500</td></tr><tr><td>Events</td><td>R4,950</td><td>R49,500</td></tr><tr><td>Business</td><td>R9,950</td><td>R99,500</td></tr><tr><td>Larger organisations</td><td colspan="2">Agreed in a contract</td></tr></table>'+
 (p?'<div class="note">You chose <b>'+p.n+'</b> on the previous screen: <b>'+R(p.m)+' a month</b>, or <b>'+R(p.m*10)+' a year</b>.</div>':'<div class="note">You did not choose a plan on the previous screen. Answer for the plan closest to your old team\'s needs.</div>')+
 ask('price_fit','Compared with what you expected, this price is…',[['lower','Lower than I expected'],['about','About what I expected'],['higher','Higher than I expected'],['much','Much higher than I expected']])+
 num('price_pay','What would your old team realistically have paid a month for the plan you chose? (a number in rand)','Your honest guess is more useful than a polite one. Put 0 if nothing.','e.g. 2500',true)+
 ask('price_how','How would they rather have paid?',[['monthly','Monthly, cancel any time'],['annual','Once a year, two months free'],['perevent','Per event, not a subscription'],['unsure','Not sure']])+
 txt('price_compare','What would you compare this price to? (A supplier you paid, a tool you used, a person\'s time?)'); } },

{ title:'The limits', body:function(){ return '<p class="lede">Every plan has limits, so that one customer cannot use so much that the service suffers for everyone. We want to know whether any of them would have stopped you.</p>'+
 '<table><tr><th>Each month, you can…</th><th>Sourcing</th><th>Events</th><th>Business</th></tr>'+
 '<tr><td>Have this many people log in (more at R395 each)</td><td>2</td><td>5</td><td>10</td></tr>'+
 '<tr><td>Send requests to this many hotels</td><td>400</td><td>1,200</td><td>3,000</td></tr>'+
 '<tr><td>Contact this many hotels your organisation has not contacted in the last 90 days</td><td>200</td><td>300</td><td>500</td></tr>'+
 '<tr><td>Have this many quotes and confirmations read for you</td><td>100</td><td>300</td><td>750</td></tr>'+
 '<tr><td>Get hands-on help from us</td><td>1 hour</td><td>2 hours</td><td>4 hours</td></tr>'+
 '<tr><td>Run guest events of up to 100 guests (counted per year, not per month)</td><td>—</td><td>120 a year</td><td>120 a year</td></tr></table>'+
 '<div class="note">If you go over, you see a warning at 80%, you can go 20% over once in a month, and nothing you have already set up is ever switched off. We never say "unlimited" because it is never true.</div>'+
 ask('lim_stop','Would any of these limits have stopped you or your team?',[['never','No, never'],['sometimes','Occasionally, in a busy month'],['often','Yes, regularly','Which limit, and what number would have worked?'],['unsure','I cannot tell from this','What would you need to know to tell?']])+
 ask('lim_clear','Are the limits written clearly enough to understand without asking?',[['yes','Yes'],['mostly','Mostly'],['no','No','What confused you?']])+
 txt('lim_note','Which limit would you change, and to what?'); } },

{ title:'Guest events — the one thing priced per event', body:function(){
  var f=S.fit||'events'; var p=PLANS[f]||PLANS.events;
  var g=+S.ge_guests||0; var html='';
  html+='<p class="lede">You read how this works a few screens back. Now the numbers. A guest event is priced by how many guests are invited, and the price is the same whether you are a company or an agency.</p>'+
  '<div class="bands"><div class="band"><b>Included</b>up to 100 guests<br><small>(up to 120 events a year)</small></div><div class="band"><b>R9,500</b>101 to 200 guests</div><div class="band"><b>R14,500</b>201 to 300 guests</div><div class="band"><b>R19,500</b>301 to 500 guests</div><div class="band"><b>Quoted</b>more than 500 guests</div></div>'+
  '<div class="note"><b>Reminder:</b> Events and Business include up to 120 guest events a year, each up to 100 guests (10 a month, carried over, on a month-to-month subscription). An event with more than 100 guests is charged at the price above — the full amount, nothing added or deducted — shown and approved first. A small event beyond the 120 is R4,500. Sourcing has no guest list, so no guest events.</div>'+
  '<div class="calc"><h3>Try it on one of your own events</h3>'+
  '<label class="f">Which plan?<select data-k="ge_plan"><option value="events"'+((S.ge_plan||f)==='events'?' selected':'')+'>Events</option><option value="business"'+(S.ge_plan==='business'?' selected':'')+'>Business</option></select></label>'+
  num('ge_guests','How many guests at your last (or next) event?','','e.g. 120',true)+
  '<div class="result" id="calcout">'+calcText()+'</div></div>'+
  ask('ge_fair','Small events included, big events (over 100 guests) paid per event — does that feel fair, on top of the monthly plan?',[['fair','Yes, fair — it is a separate job'],['twice','No, it feels like paying twice'],['depends','Depends on the number','What number would feel fair for your event?'],['unsure','Not sure']])+
  num('ge_paid','What did your company last pay an RSVP or registration supplier for one event? (rand, if you know)','Put 0 if you did it yourselves.','e.g. 35000')+
  ask('ge_who','Who would have run the RSVP in your world?',[['us','Our own team'],['agency','Our event agency'],['supplier','A specialist RSVP supplier'],['mix','Depends on the event']])+
  txt('ge_note','Anything here that would stop you buying, or that you would change?');
  return html; } },

{ title:'Help and getting started', body:function(){ return '<p class="lede">Three things every plan includes, and one thing you can book.</p>'+
 '<div class="card"><p><b>Getting started is included.</b> We set up your company, your branding and your users, and run one 60-minute session with the person who will use it most, on one of your real bookings. Online, not on site.</p><p style="margin-top:10px"><b>If GroupBook breaks, we fix it at no charge.</b> If it stops you working, we respond within two working hours, Monday to Friday 08:00–17:00; anything else, the next working day.</p><p style="margin-top:10px"><b>Hands-on help is included each month</b> (1, 2 or 4 hours depending on plan). Anything bigger — loading years of old data, extra training — is quoted first at R699 an hour, and you approve it before we start.</p><p style="margin-top:10px"><b>For a big event, you can pre-book remote support for the event days</b> at R1,950 a day, subject to availability and an agreed scope: the hours covered, who answers and how fast are agreed when you book. Not on site.</p></div>'+
 ask('sup_clear','Is this clear?',[['yes','Yes'],['mostly','Mostly','What is not quite clear?'],['no','No','What is unclear?']])+
 ask('sup_fair','Is it fair?',[['yes','Yes'],['mostly','Mostly','What would make it fair?'],['no','No','Why not?']])+
 ask('sup_window','Would you have booked the event-day cover for a big event?',[['yes','Yes'],['maybe','Maybe, depending on the event'],['no','No']])+
 txt('sup_note','What support would you have expected that is not here?'); } },

{ title:'The decision', body:function(){ return '<p class="lede">Knowing everything you have seen…</p>'+
 ask('buy','Would your old team have bought this?',[['yes','Yes'],['only','Only if something changed','What would have to change?'],['no','No','Why not?']])+
 ask('trial','Would they have paid for one month to try it on a real booking?',[['yes','Yes'],['free','Only if the first month was free'],['no','No','Why not?']])+
 txt('definite','What one thing would have made it a definite yes?')+
 txt('hero','One last thing: if you landed on our website and saw the line "Source suppliers. Coordinate group travel. One place." — would you read on? What would you have written instead?')+
 ask('followup','May Danie come back to you with one or two follow-up questions?',[['yes','Yes'],['no','Rather not']],'',true); } },

{ title:'Copy your answers to send', body:function(){ return '<p class="lede">Thank you. Nothing has been sent yet. Press the button, then paste into WhatsApp or an email to Danie.</p>'+
 '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn gold" id="copy">Copy answers to send</button><button class="btn sec" id="clear">Start a new response</button><span class="toast" id="copytoast"></span></div>'+
 '<pre class="out" id="out">'+summary().replace(/</g,'&lt;')+'</pre>'+
 '<p class="hint" style="margin-top:10px">If the copy button does not work on your phone, press and hold on the box above, choose Select all, then Copy.</p>'; } }
];

function calcText(){
  var plan=PLANS[S.ge_plan||S.fit||'events']||PLANS.events; if(plan.inc===0) plan=PLANS.events; var g=+S.ge_guests||0;
  if(!g) return 'Type a number of guests and we will show what it would cost on '+plan.n+'.';
  var band=bandPrice(g);
  if(g<=plan.cap) return '<b>Included</b>On '+plan.n+' a '+g+'-guest event is one of the 120 a year included at no extra charge (each up to '+plan.cap+' guests). Your plan stays '+R(plan.m)+' a month.';
  if(band===null) return '<b>Quoted</b>More than 500 guests — we would quote this one. Your plan stays '+R(plan.m)+' a month.';
  return '<b>'+R(band)+' extra for this event</b>A '+g+'-guest event is over the 100-guest line, so it is charged at its band: '+R(band)+', shown to you and approved before it is switched on. Your plan stays '+R(plan.m)+' a month.';
}

var LABELS = { ge_plan:{q:'Plan used in the calculator', opts:[['events','Events'],['business','Business']]} };
function summary(){
  var lines=['GroupBook plans & prices test — answers','Date: '+new Date().toISOString().slice(0,10),'Name: '+(S.name||'(not given)'),''];
  SCREENS.forEach(function(sc,i){ if(i===0||i===SCREENS.length-1) return; lines.push(sc.title.toUpperCase());
    var html=sc.body(); var re=/data-k="([a-z_]+)"/g, m, seen={};
    while((m=re.exec(html))){ var k=m[1]; if(seen[k]) continue; seen[k]=1; var v=S[k]; if(v===undefined||v==='') continue;
      var lab=LABELS[k]; var qq=lab?lab.q:k; var vv=v; if(lab&&lab.opts){ lab.opts.forEach(function(o){ if(o[0]===v) vv=o[1]; }); }
      lines.push('  '+qq.replace(/<[^>]+>/g,'')+': '+String(vv).replace(/<[^>]+>/g,'')); }
    if(sc.title.indexOf('Guest events')===0 && S.ge_guests){ lines.push('  Calculator result: '+calcText().replace(/<[^>]+>/g,' ').trim()); }
    lines.push(''); });
  return lines.join('\n');
}
// capture labels for the summary
(function(){ var _ask=ask, _txt=txt, _num=num;
  ask=function(k,q,o,h,opt){ LABELS[k]={q:q,opts:o}; return _ask(k,q,o,h,opt); };
  txt=function(k,l,h){ LABELS[k]={q:l}; return _txt(k,l,h); };
  num=function(k,l,h,p,r){ LABELS[k]={q:l}; return _num(k,l,h,p,r); };
})();

function render(){
  var sc=SCREENS[step]; var v=document.getElementById('view'); REQ={};
  v.innerHTML='<div class="stepno">Screen '+(step+1)+' of '+SCREENS.length+'</div><h1>'+sc.title+'</h1>'+sc.body()+'<div class="missmsg" id="missmsg"></div>'+(step>0&&step<SCREENS.length-1?'<p class="hint" style="margin-top:14px">Questions marked * need an answer before you go on. Everything else is optional.</p>':'');
  document.getElementById('bar').style.width=Math.round((step)/(SCREENS.length-1)*100)+'%';
  document.getElementById('back').disabled=step===0;
  document.getElementById('next').style.visibility = step===SCREENS.length-1 ? 'hidden':'visible';
  document.getElementById('where').textContent = step===SCREENS.length-1 ? '' : (SCREENS.length-1-step)+' to go';
  v.querySelectorAll('[data-k]').forEach(function(el){
    var ev = el.tagName==='SELECT'||el.type==='radio' ? 'change':'input';
    el.addEventListener(ev,function(){ S[el.getAttribute('data-k')]=el.value; save();
      if(el.type==='radio'){ v.querySelectorAll('input[name="'+el.name+'"]').forEach(function(r){ r.closest('.opt').classList.toggle('on', r.checked); var fu=r.closest('div').querySelector('.sub'); if(fu){ fu.style.display=r.checked?'block':'none'; var fk=fu.getAttribute('data-fu'); REQ[fk]=r.checked; } }); }
      if(el.getAttribute('data-k')==='ge_plan'||el.getAttribute('data-k')==='ge_guests'){ var o=document.getElementById('calcout'); if(o) o.innerHTML=calcText(); }
    });
  });
  var c=document.getElementById('copy'); if(c){ c.onclick=function(){ var t=summary(); var done=function(){ document.getElementById('copytoast').textContent='Copied — now paste it into WhatsApp or an email.'; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,function(){ fallback(t); done(); }); } else { fallback(t); done(); } }; }
  var cl=document.getElementById('clear'); if(cl){ cl.onclick=function(){ if(confirm('Clear all your answers and start again?')){ S={}; save(); step=0; render(); window.scrollTo(0,0);} }; }
  S._step=step; save(); window.scrollTo(0,0);
}
function fallback(t){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
function missing(){ var v=document.getElementById('view'); var out=[];
  Object.keys(REQ).forEach(function(k){ if(!REQ[k]) return; var el=v.querySelector('[data-k="'+k+'"]'); if(!el) return;
    var val=S[k]; if(val===undefined||val===null||String(val).trim()==='') out.push(k); });
  return out; }
document.getElementById('next').onclick=function(){
  var v=document.getElementById('view'); v.querySelectorAll('.ask.miss').forEach(function(a){a.classList.remove('miss');});
  var m=missing();
  if(m.length){ var first=null; m.forEach(function(k){ var el=v.querySelector('[data-k="'+k+'"]'); var a=el&&(el.closest('.ask')||el.closest('.sub')); if(a){ a.classList.add('miss'); if(!first) first=a; } });
    var msg=document.getElementById('missmsg'); msg.style.display='block'; msg.textContent=m.length===1?'One question still needs an answer — it is marked in red.':m.length+' questions still need an answer — they are marked in red.';
    if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); } return; }
  if(step<SCREENS.length-1){ step++; render(); } };
document.getElementById('back').onclick=function(){ if(step>0){ step--; render(); } };
render();
</script>
</body></html>
