<style>button{touch-action:manipulation}

.seg{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.seg h3{font-size:17px}.seg p{font-size:14px;color:var(--ink2);margin-top:4px}
.seg .pl{font-size:12.5px;color:var(--gold);font-weight:600;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.jobs{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.job2{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.job2 h3{font-size:17px}.job2 p{font-size:14px;color:var(--ink2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:12.5px;border-radius:8px;padding:4px 9px}
.chips .full{background:var(--navy);color:#fff}.chips .part{border:1.5px solid var(--gold);color:var(--navy)}
.sc{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;margin-top:10px}
.sc>b{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif;font-size:14px}
.sc h3{font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc .tg{font-family:"DM Sans";font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:6px;padding:2px 7px;border:1.5px solid var(--ok);color:var(--ok)}
.sc .tg.t{border-color:var(--gold);color:var(--gold)}
.sc .bf{font-size:14px;color:var(--ink3);margin-top:6px;font-style:italic}
.sc .wg{font-size:14.5px;color:#1F4D33;margin-top:3px;font-weight:500}
.sc small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;font-style:normal;opacity:.7}
.pl2{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.pl2.hi{border-color:var(--gold)}.pl2 .nm{font-family:"Playfair Display",serif;font-size:21px;color:var(--navy)}
.pl2 .for{font-size:14.5px;color:var(--ink2);margin-top:2px}.pl2 ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:14.5px;color:var(--ink)}
.pl2 li{padding-left:22px;position:relative}.pl2 li:before{content:"\2713";position:absolute;left:0;color:var(--ok);font-weight:700}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}.lrow span{font-weight:500}.lrow input{margin-top:0}.hrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}.hrow span{font-weight:500}.hrow select{margin-top:0;font-size:16px}@media(max-width:560px){.hrow{grid-template-columns:1fr;gap:2px}}
.lsub{font-size:13px;font-weight:600;color:var(--navy);margin-top:14px}
.pair2 .dash{color:var(--line);text-align:center;padding:12px 0;font-size:18px}.pair2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair2 label{display:block;font-size:13px;font-weight:500;color:var(--ink3)}.pair2 input{margin-top:2px}
input[inputmode=numeric]{font-variant-numeric:tabular-nums;letter-spacing:.03em}.ordwarn{display:none;margin-top:6px;font-size:13px;color:#9a5b00;background:#fff1d6;border-radius:8px;padding:6px 10px}
@media (max-width:520px){.bands{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}
</style></head><body>
<header><img src="https://www.groupbook.co.za/logo-on-navy.png" alt="GroupBook"><span>Would GroupBook fit your team? A short questionnaire</span></header>
<div class="wrap">
<div class="prog"><i id="bar"></i></div>
<div id="view"></div>
</div>
<div class="navbar"><div class="in"><button class="btn sec" id="back">Back</button><span style="font-size:13px;color:var(--ink3);text-align:center;line-height:1.3"><span id="where"></span><br><a href="#" id="sv" style="color:var(--ink3)">Save and finish later</a></span><button class="btn" id="next">Next</button></div></div>

<script>
// ---------- state
var S = {}; try { S = JSON.parse(localStorage.getItem('gb_rs') || '{}'); } catch(e) { S = {}; }
function save(){ try{ localStorage.setItem('gb_rs', JSON.stringify(S)); }catch(e){} }
var SURVEY_VERSION = '2026-10-research34';
if(S._v!==SURVEY_VERSION){ S={_v:SURVEY_VERSION}; try{ localStorage.setItem('gb_rs', JSON.stringify(S)); }catch(e){} }
// resume link: #r=<state> restores answers on any device. Treated as untrusted input.
(function(){ try{ var m=/^#r=([A-Za-z0-9_\-]+)$/.exec(location.hash); if(!m) return;
  var o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
  if(o && o._v===SURVEY_VERSION){ var c={_v:SURVEY_VERSION};
    Object.keys(o).forEach(function(k){ if(!/^[A-Za-z0-9_]{1,40}$/.test(k)) return; var v=o[k];
      if(typeof v==='string') c[k]=v.slice(0,1500); else if(typeof v==='boolean') c[k]=v; else if(typeof v==='number'&&isFinite(v)) c[k]=(k==='_step'?v:String(v));
      else if(Array.isArray(v)) c[k]=v.filter(function(x){return typeof x==='string';}).map(function(x){return x.slice(0,40);}).slice(0,12); });
    delete c._done; S=c; save(); }
  history.replaceState(null,'',location.pathname+location.search); }catch(e){} })();
var step = +(S._step || 0); if(!(step>=0)) step=0;

// ---------- helpers (plain radio / text / number)
function ask(key, q, opts, hint, optional){
  REQ[key] = !optional;
  return '<div class="ask" data-ask="'+key+'"><div class="q">'+q+(optional?'':'<span class="req" title="needed">*</span>')+'</div>'+(hint?'<div class="hint" style="margin:-4px 0 8px">'+hint+'</div>':'')+'<div class="opts">'+
    opts.map(function(o){ var v=o[0], l=o[1], fu=o[2]; var on = S[key]===v; var fk=key+'__'+v;
      var box = fu ? '<div class="sub" data-fu="'+fk+'" style="display:'+(on?'block':'none')+'"><label class="f" style="margin-top:4px;font-weight:500;font-size:14px">'+fu+' <span class="reqnote" style="font-weight:600;font-size:13px">(needed to go on)</span><textarea data-k="'+fk+'">'+esc(S[fk])+'</textarea></label></div>' : '';
      if(fu){ LABELS[fk]={q:l+' — '+fu}; if(on) REQ[fk]=true; }
      return '<div><label class="opt'+(on?' on':'')+'"><input type="radio" name="'+key+'" value="'+v+'"'+(on?' checked':'')+' data-k="'+key+'"><span>'+l+'</span></label>'+box+'</div>'; }).join('')+'</div></div>';
}
var REQ = {};
function txt(key, label, hint){ return '<label class="f">'+label+'<textarea data-k="'+key+'">'+esc(S[key])+'</textarea></label>'+(hint?'<div class="hint">'+hint+'</div>':''); }
function UNIT(t){ return '<div class="unit">'+t+'</div>'; }
function num(key, label, hint, ph, required, dec, unit){ if(required) REQ[key]=true; return '<div class="ask" data-ask="'+key+'"><label class="f">'+label+(required?'<span class="req">*</span>':'')+'</label>'+(unit?UNIT(unit):'')+'<label class="f" style="margin-top:0"><input type="tel" name="gbq_'+key+'" inputmode="'+(dec?'decimal':'numeric')+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" data-k="'+key+'" value="'+esc(S[key])+'" placeholder="'+(ph||'')+'"></label>'+(hint?'<div class="hint">'+hint+'</div>':'')+(required?'<div class="hint reqnote">Needed to go on.</div>':'')+'</div>'; }
function R(n){ return 'R'+Math.round(n).toLocaleString('en-ZA'); }

// ---------- the model (test values)
var PLANS = {
  sourcing:  { n:'Sourcing', m:1950, inc:0,  cap:0,   passes:0, passcap:0, users:2,  maxu:5,  help:'1 hour' },
  events:    { n:'Boutique',   m:4950, inc:60,  cap:100, passes:1, passcap:150, users:4,  maxu:10, help:'2 hours' },
  business:  { n:'Full House', m:9950, inc:120, cap:150, passes:3, passcap:200, users:10, maxu:20, help:'4 hours' }
};
var BANDS = [[100,4500],[200,9500],[300,14500],[500,19500]];
// research32: the modular card (19 Oct 2026). Four modules on one size scale. Prices are shown ONLY on priced links.
var MODS = ['sourcing','rsvp','travel','recon'];
var MODN = {sourcing:'Sourcing',rsvp:'RSVP',travel:'Travel',recon:'Recon'};
var MODD = {sourcing:'Brief in, one branded request to the right hotels and venues, quotes compared side by side, award and decline. Forward a client\'s email and the request is drafted for you.',
            rsvp:'Invitations, online replies, a guest page and QR check-in on your branding, with dietary and special needs on the guest list. Reminders and change alerts.',
            travel:'Rooming lists, flights, transfers, car hire, supplier manifests, guest confirmations and a personal itinerary on every guest\'s phone. Never charged per guest.',
            recon:'Import the card statement and match it to bookings and purchase orders; exceptions reviewed by you; budgets per event.'};
var MODJOB = {sourcing:'Finding and booking the hotel or venue',rsvp:'Inviting guests and running the RSVP or registration',travel:'Rooms, flights, transfers and car hire for the guests',recon:'Reconciling the card statement or supplier payments afterwards'};
var JOBOPTS = [['us','My team does it'],['out','A specialist, agency or supplier does it for us'],['client','The client or another party does it'],['none','Not part of our work']];
var SIZES = [{k:'small',n:'Small',users:2,maxu:5,cap:100,inc:50,help:'1 hour'},{k:'mid',n:'Mid',users:5,maxu:10,cap:150,inc:80,help:'2 hours'},{k:'large',n:'Large',users:10,maxu:20,cap:250,inc:100,help:'4 hours'}];
var MODP = {sourcing:[1950,2950,3950],rsvp:[2500,4500,7500],travel:[6000,11000,16500],recon:[1500,2500,3500]};
function sizeOf(k){ for(var i=0;i<SIZES.length;i++){ if(SIZES[i].k===k) return SIZES[i]; } return null; }
function sizeIdx(k){ for(var i=0;i<SIZES.length;i++){ if(SIZES[i].k===k) return i; } return 1; }
function selMods(){ return (S.mods||[]).filter(function(m){ return MODS.indexOf(m)>-1; }); }
function hasRsvp(){ return selMods().indexOf('rsvp')>-1; }
var TDESK=[8500,14500,21500]; // research33: the Travel desk (Sourcing + Travel + Recon) has its own price; other modules join it at 20% off (decision 19 Oct, D18 23 Oct)
function pkgPrice(mods,si){ var sum=0; mods.forEach(function(m){ sum+=MODP[m][si]; });
  if(['sourcing','travel','recon'].every(function(m){ return mods.indexOf(m)>-1; })){ var extra=0; mods.forEach(function(m){ if(['sourcing','travel','recon'].indexOf(m)<0) extra+=MODP[m][si]; }); var mo=TDESK[si]+Math.round(extra*0.8/50)*50; return {list:sum, monthly:mo, disc:1-mo/sum}; }
  var d=mods.length>=3?0.2:mods.length===2?0.1:0; return {list:sum, monthly:Math.round(sum*(1-d)/50)*50, disc:d}; }
function pkgName(){ var m=selMods(); var sz=sizeOf(S.size); return (m.length?m.map(function(x){return MODN[x];}).join(' + '):'no modules')+(sz?' at '+sz.n+' size':''); }
function bandPrice(g){ for (var i=0;i<BANDS.length;i++){ if (g<=BANDS[i][0]) return BANDS[i][1]; } return null; }

function STEPS_HTML(){
  function c(n,t,bf,wg,tag){ return '<div class="sc"><b>'+n+'</b><div><h3>'+t+' <span class="tg'+(tag?' t':'')+'">'+(tag||'Live')+'</span></h3><div class="bf"><small>Before</small>'+bf+'</div><div class="wg"><small>With GroupBook</small>'+wg+'</div></div></div>'; }
  return '<p class="lede">Seven steps, from the client\'s (or your business unit\'s) brief to the final bill. Does this look like your job?</p>'+
  c(1,'The brief arrives','Emails back and forth, retyped into a spreadsheet.','One form. One click makes it a quote request.')+
  c(2,'Shortlist from the directory','Phone the front desk to find who handles groups.','We hold the group-desk address, with the date we last checked it.')+
  c(3,'Send one request','Ten emails, ten follow-ups.','Send once. Replies file themselves.')+
  c(4,'Compare and award','Retype every quote; forget to tell the losers.','Quotes side by side. One click awards; the rest are told.')+
  c(5,'Invite and look after the guests','A spreadsheet of names and an RSVP supplier for each event.','Invite, track and inform every guest from one list.')+

    el.addEventListener(ev,function(){ var k=el.getAttribute('data-k');
      if(el.type==='checkbox'){ S[k]=el.checked; var lb=el.closest('.opt'); if(lb) lb.classList.toggle('on',el.checked); }
      else { var val=el.value; var im=el.getAttribute('inputmode'); if(im==='numeric'){ var cp=el.selectionStart||0, before=el.value.slice(0,cp).replace(/[^0-9]/g,'').length; val=val.replace(/[^0-9]/g,''); var shown=fmtN(val); if(shown!==el.value){ el.value=shown; var i=0,c=0; while(i<shown.length&&c<before){ if(/[0-9]/.test(shown[i])) c++; i++; } try{ el.setSelectionRange(i,i); }catch(e){} } ordCheck(el,k,val); } else if(im==='decimal'){ val=val.replace(/,/g,'.').replace(/[^0-9.]/g,'').replace(/^(\d*\.\d?).*$/,'$1'); if(val!==el.value) el.value=val; } S[k]=val; }
      save(); if(typeof updGrid==='function') updGrid(); var a=el.closest('.ask'); if(a) a.classList.remove('miss'); if(!v.querySelector('.ask.miss,.sub.miss')){ var mm=document.getElementById('missmsg'); if(mm) mm.style.display='none'; }
      if(el.type==='radio'){ v.querySelectorAll('input[name="'+el.name+'"]').forEach(function(r){ r.closest('.opt').classList.toggle('on', r.checked); var fu=r.closest('div').querySelector('.sub'); if(fu){ fu.style.display=r.checked?'block':'none'; var fk=fu.getAttribute('data-fu'); REQ[fk]=r.checked; } }); }
    });
  });
  v.querySelectorAll('[data-m]').forEach(function(el){ el.addEventListener('change',function(){ var k=el.getAttribute('data-m'); var sel=S[k]||[];
    if(el.checked){ if(sel.indexOf(el.value)<0) sel.push(el.value); if(el.value==='none') sel=['none']; else sel=sel.filter(function(x){return x!=='none';}); }
    else { sel=sel.filter(function(x){return x!==el.value;}); }
    S[k]=sel; save(); var ak=el.closest('.ask'); if(ak) ak.classList.remove('miss'); v.querySelectorAll('[data-m="'+k+'"]').forEach(function(c){ c.checked=sel.indexOf(c.value)>-1; c.closest('.opt').classList.toggle('on',c.checked); }); }); });
  S._step=step; save(); if(typeof updGrid==='function') updGrid(); window.scrollTo(0,0);
}
// research32i: warn (never block) when 'I would expect' is above 'Too expensive at' in the same pair, e.g. 35 000 typed for 3 500
function ordCheck(el,k,val){ var m=/^(.*)_(pay|walk)$/.exec(k); if(!m) return; var a=n(m[2]==='pay'?val:S[m[1]+'_pay']), w=n(m[2]==='walk'?val:S[m[1]+'_walk']); var box=el.closest('.ask'); if(!box) return; var wn=box.querySelector('.ordwarn'); if(!wn){ wn=document.createElement('div'); wn.className='ordwarn'; box.appendChild(wn); }
  if(a!==null&&w!==null&&a>w){ wn.textContent='Please check: "I would expect" (R'+fmtN(a)+') is higher than "Too expensive at" (R'+fmtN(w)+').'; wn.style.display='block'; } else wn.style.display='none'; }
function missing(){ var v=document.getElementById('view'); var out=[];
  Object.keys(REQ).forEach(function(k){ if(!REQ[k]) return; var el=v.querySelector('[data-k="'+k+'"]')||v.querySelector('[data-m="'+k+'"]'); if(!el) return;
    if(el.hasAttribute('data-m')){ if(!(S[k]&&S[k].length)) out.push(k); return; }
    if(S[k+'_dk']) return; if(k==='pe_pay'&&S.pe_dk) return; var val=S[k]; if(el.type==='checkbox'){ if(!val) out.push(k); return; } if(val===undefined||val===null||String(val).trim()==='') out.push(k); });
  return out; }
function flag(keys,msgId,suffix){ var v=document.getElementById('view'); var first=null;
  keys.forEach(function(k){ var el=v.querySelector('[data-k="'+k+'"]')||v.querySelector('[data-m="'+k+'"]'); var a=el&&(el.closest('.ask')||el.closest('.sub')); if(a){ a.classList.add('miss'); if(!first) first=a; } });
  var msg=document.getElementById(msgId); if(msg){ msg.style.display='block'; msg.textContent=keys.length===1?'One '+suffix+' still needs an answer. It is marked in red.':keys.length+' '+suffix+'s still need an answer. They are marked in red.'; }
  if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); var fi=first.querySelector('input,textarea,select'); if(fi&&fi.type!=='radio'&&fi.type!=='checkbox'){ setTimeout(function(){ try{fi.focus();}catch(e){} },350); } } }
function submit(){
  var v=document.getElementById('view'); v.querySelectorAll('.ask.miss').forEach(function(a){a.classList.remove('miss');});
  var m=missing();
  if(!S.email||!/^[^@\s]+@[^@\s.][^@\s]*\.[^@\s.]{2,}$/.test(S.email)||/\.\./.test(S.email)){ if(m.indexOf('email')<0) m.push('email'); }
  if(S.trial_req && !(S.org&&String(S.org).trim())) m.push('org');
  if(m.length){ flag(m,'sendmsg','thing'); return; }
  var b=document.getElementById('next'); b.disabled=true; b.textContent='Sending…';
  var p=payload();
  if(JSON.stringify(p.answers).length>3900){ Object.keys(p.answers.t).forEach(function(k){ if(p.answers.t[k]) p.answers.t[k]=p.answers.t[k].slice(0,100); }); }
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
  .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok) throw new Error(j&&j.error?j.error:'HTTP '+r.status); return j; }); })
  .then(function(){ S._done=true; save(); render(); })
  .catch(function(e){ b.disabled=false; b.textContent='Send my answers'; var msg=document.getElementById('sendmsg'); msg.style.display='block';
    var body=encodeURIComponent('GroupBook research survey\n\n'+JSON.stringify(p,null,2));
    msg.innerHTML='Sorry, that did not send'+(e&&e.message&&!/HTTP|Failed to fetch|NetworkError/.test(e.message)?' ('+esc(e.message)+')':'')+'. Your answers are saved on this phone; please try again in a moment, or <a href="mailto:support@groupbook.co.za?subject=GroupBook%20research%20survey&body='+body+'">email them to us</a> with one tap.'; });
}
document.getElementById('next').onclick=function(){
  var v=document.getElementById('view');
  v.querySelectorAll('[data-k]').forEach(function(el){ var k=el.getAttribute('data-k'); if(el.type==='radio'){ if(el.checked) S[k]=el.value; } else if(el.type==='checkbox'){ S[k]=el.checked; } else if(el.value!==undefined && el.value!=='') S[k]=el.value; }); save();
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  if(step===N-1){ submit(); return; }
  v.querySelectorAll('.ask.miss').forEach(function(a){a.classList.remove('miss');});
  var m=missing(); if(m.length){ flag(m,'missmsg','question'); return; }
  if(step===0 && S.screen==='no'){ render(); return; }
  step++; render(); };
document.getElementById('back').onclick=function(){ if(step>0){ step--; render(); } };
function peVals(){ return [n(S.pe_pay),n(S.pe_walk)]; }
function peStatus(){ if(S.pe_dk) return 'cannot_say'; var a=n(S.pe_pay), w=n(S.pe_walk), g=(a!==null?1:0)+(w!==null?1:0); return g===0?'skipped':(g===2?'complete':'partial'); }
function peOrderOk(){ var v=peVals().filter(function(x){return x!==null;}); if(v.length<2) return null; for(var i=1;i<v.length;i++){ if(v[i]<v[i-1]) return false; } return true; }
function updPe(){ var el=document.getElementById('pechk'); if(!el) return; var ok=S.pe_dk?null:peOrderOk(); el.textContent=(ok===false)?'The too-expensive amount is usually higher than the amount you expect to pay. Please check the two. You can still send it as it is.':''; el.style.color=(ok===false)?'#8E2A1A':''; }
function updGrid(){ updPe(); recomputeSz(); if(typeof updOver==='function') updOver(); var el=document.getElementById('gridchk'); if(!el) return; var t=szSum(), y=n(S.events_year);
  if(t===null){ el.textContent=''; return; }
  var off=(y!==null&&y>0&&(t>y*1.5||t<y/1.5))||(y===0&&t>0);
  el.textContent='The sizes add up to '+t+' events a year'+(y!==null?' (you said about '+y+' in total).':'.')+(off?' These are quite far apart, which is fine if you are unsure. You can adjust either, or carry on.':'');
  el.style.color=off?'#8E2A1A':''; }
function resumeUrl(){ var o={}; Object.keys(S).forEach(function(k){ if(k!=='_done') o[k]=S[k]; });
  var b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin+location.pathname+(location.search||'')+'#r='+b; }
window.gbPc=function(){ var em=(document.getElementById('pcem').value||'').trim(), m=document.getElementById('pcmsg');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ m.textContent='Please type a valid email address first.'; return; }
  m.textContent='';
  document.getElementById('view').querySelectorAll('[data-k]').forEach(function(el){ var k=el.getAttribute('data-k'); if(el.type==='radio'){ if(el.checked) S[k]=el.value; } else if(el.type==='checkbox'){ S[k]=el.checked; } else if(el.value!==undefined && el.value!=='') S[k]=el.value; }); S._step=step; save();
  location.href='mailto:'+encodeURIComponent(em).replace('%40','@')+'?subject='+encodeURIComponent('Open this on your computer: GroupBook questionnaire')+'&body='+encodeURIComponent('Open this link on your computer to carry on where you stopped:\n\n'+resumeUrl()); };
document.getElementById('sv').onclick=function(e){ e.preventDefault();
  var v=document.getElementById('view');
  v.querySelectorAll('[data-k]').forEach(function(el){ var k=el.getAttribute('data-k'); if(el.type==='radio'){ if(el.checked) S[k]=el.value; } else if(el.type==='checkbox'){ S[k]=el.checked; } else if(el.value!==undefined && el.value!=='') S[k]=el.value; }); S._step=step; save();
  var old=document.getElementById('svp'); if(old) old.remove();
  v.insertAdjacentHTML('afterbegin','<div class="card" id="svp" style="border-left:4px solid var(--gold)"><h3>Your link to finish later</h3><p style="margin-top:6px">Open this link on any phone or computer to carry on where you stopped. It contains the answers you have given so far, so keep it to yourself or a colleague you trust. Nothing has been sent to us yet.</p><label class="f"><textarea id="svl" readonly rows="4"></textarea></label><div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap"><button class="btn" id="svc" type="button">Copy link</button><a class="btn sec" id="sve" style="text-decoration:none;display:inline-flex;align-items:center">Email it to myself</a></div><div class="hint" id="svm" style="margin-top:6px"></div></div>');
  var url=resumeUrl(); var ta=document.getElementById('svl'); ta.value=url;
  document.getElementById('sve').href='mailto:?subject='+encodeURIComponent('My GroupBook questionnaire: link to finish later')+'&body='+encodeURIComponent('Open this link to carry on where I stopped:\n\n'+url);
  document.getElementById('svc').onclick=function(){ var m=document.getElementById('svm');
    function ok(){ m.textContent='Copied.'; }
    function fb(){ ta.focus(); ta.select(); try{ document.execCommand('copy'); ok(); }catch(x){ m.textContent='Press and hold the link above to copy it.'; } }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(ok,fb); } else fb(); };
  window.scrollTo(0,0); };
render();
</script>
